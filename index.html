<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Немецкие карточки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #1c1233;
    --paper: #fffaf0;
    --pink: #ff3d8b;
    --amber: #ffb627;
    --teal: #19d3c5;
    --violet: #6a3dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: #140a2b;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- Фон: цвет по краям, тишина в центре ---------- */
  :root { --h: 0; }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #130828; }
  /* тёмная «подушка» за карточкой, чтобы слово читалось на любом фоне */
  .bg::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 42% at 50% 48%, rgba(15,7,32,.92) 0%, rgba(15,7,32,.6) 55%, transparent 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(55px); opacity: .55;
    animation: drift 32s ease-in-out infinite alternate;
    transition: background-color 2s ease, opacity .6s; }
  .b1 { width: 340px; height: 340px; top: -110px;  left: -110px;  background: hsl(calc(var(--h) + 330), 95%, 58%); }
  .b2 { width: 360px; height: 360px; bottom: -120px; right: -120px; background: hsl(calc(var(--h) + 175), 90%, 50%); animation-delay: -9s; }
  .b3 { width: 280px; height: 280px; top: -90px;  right: -110px; background: hsl(calc(var(--h) + 40), 100%, 58%); animation-delay: -17s; }
  .b4 { width: 300px; height: 300px; bottom: -110px; left: -120px; background: hsl(calc(var(--h) + 260), 95%, 62%); animation-delay: -5s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.2); }
  }
  /* немецкие буквы плывут только вдоль краёв, не за карточкой */
  .letter { position: absolute; bottom: -60px; font-weight: 900; color: rgba(255,255,255,.07);
    animation: rise linear infinite; user-select: none; }
  @keyframes rise { to { transform: translateY(-125vh) rotate(25deg); } }
  /* яркий режим: насыщеннее и быстрее */
  body:not(.calm) .blob { opacity: .85; animation-duration: 14s; }
  body:not(.calm) .letter { color: rgba(255,255,255,.14); }
  .tools { position: relative; z-index: 1; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Layout ---------- */
  header, main, nav { position: relative; z-index: 1; width: 100%; max-width: 440px; }
  h1 { font-size: 26px; margin: 4px 0 14px; text-align: center; letter-spacing: .5px;
    text-shadow: 0 3px 0 rgba(255,61,139,.55); }
  select {
    width: 100%; padding: 13px 14px; border-radius: 16px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(20,10,43,.55); color: #fff; font-size: 16px; backdrop-filter: blur(8px);
    appearance: none; -webkit-appearance: none;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }

  /* ---------- Card ---------- */
  .scene { width: 100%; height: 250px; perspective: 1200px; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card.enter { animation: pop .4s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.85) rotate(-3deg); } }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; box-shadow: 0 18px 0 -6px rgba(0,0,0,.28), 0 28px 50px rgba(0,0,0,.35); }
  .front { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); }
  .back  { background: linear-gradient(135deg, var(--amber), var(--pink)); color: var(--ink);
           border: 4px solid var(--ink); transform: rotateY(180deg); }
  .word { font-size: clamp(34px, 11vw, 52px); font-weight: 900; line-height: 1.1; word-break: break-word; }
  .hint { margin-top: 18px; font-size: 14px; opacity: .55; }

  /* ---------- Controls ---------- */
  nav { display: flex; align-items: center; gap: 12px; }
  .btn { flex: 1; padding: 16px 0; font-size: 18px; font-weight: 800; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px; cursor: pointer;
    box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; }
  .prev { background: var(--teal); }
  .next { background: var(--amber); }
  .counter { min-width: 76px; text-align: center; font-weight: 800; font-size: 17px; }
  .shuffle { position: relative; z-index: 1; margin-top: 14px; background: none; border: 2px dashed rgba(255,255,255,.4);
    color: #fff; border-radius: 14px; padding: 8px 16px; font-size: 14px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { .blob, .letter, .card, .card.enter { animation: none; transition: none; } }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<header>
  <h1>🇩🇪 Немецкие карточки</h1>
  <select id="deck" aria-label="Набор слов"></select>
</header>

<main>
  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку">
      <div class="face front"><div class="word" id="de"></div><div class="hint">Нажмите, чтобы увидеть перевод</div></div>
      <div class="face back"><div class="word" id="ru"></div></div>
    </div>
  </div>
  <nav>
    <button class="btn prev" id="prev">← Назад</button>
    <div class="counter" id="counter"></div>
    <button class="btn next" id="next">Вперёд →</button>
  </nav>
  <div class="tools"><button class="shuffle" id="shuffle">🔀 Перемешать</button><button class="shuffle" id="bgBtn"></button></div>
</main>

<script>
  // Слова из тетради. Формат строки: немецкое | перевод | категория (категорию можно не указывать)

Auf Wiederhören | До свидания (по тел.) | Фразы и выражения

Schönes Wochenende | Хороших выходных | Фразы и выражения

Das | Это | Местоимения

Kaffee | кофе | Существительные
mein / meine | мой / моя | Местоимения
Mutter / Mama | мать / мама | Существительные
Hand | рука | Существительные
alle zusammen | все вместе | Фразы и выражения
Hallo alle zusammen! | Привет всем! | Фразы и выражения
dein / deine | твой | Местоимения
kein / keine | никакой (отрицание) | Местоимения

Lehrerin | учительница | Существительные
spricht | говорить | Глаголы
woher | откуда | Наречия
kommen | приходить, приезжать | Глаголы
aus | из | Предлоги
das Leben | жизнь | Существительные
von | от, о | Предлоги

mögen | нравиться, любить | Глаголы
spielen | играть | Глаголы
kaufen | покупать | Глаголы
kennen | знать кого-то / быть знакомым | Глаголы
Wen | кого | Местоимения
mit | с; при помощи | Предлоги
bei | у, при, во время, у кого-то | Предлоги

spazieren | гулять | Глаголы
wohin | куда | Наречия

der Laden | магазин | Существительные
zur / auf Arbeit | на работу | Фразы и выражения
nach Hause | домой | Фразы и выражения
mir | мне | Местоимения
Bruder | брат | Существительные
verheiratet | женатый | Прилагательные
geschieden | разведённый | Прилагательные
ledig | холостой, незамужняя | Прилагательные
jetzt | сейчас | Наречия
Aber | Но |

oder | или |

frei | свободен | Прилагательные
Wann | Когда | Наречия

Dienstag | Вторник | Существительные
Mittwoch | Среда | Существительные
Donnerstag | Четверг | Существительные
Freitag | Пятница | Существительные
Samstag / Sonnabend | Суббота | Существительные
Sonntag | Воскресенье | Существительные
jeden | каждый | Местоимения
die Woche | неделя | Существительные
die Uhren | часы | Существительные
rund um die Uhr | круглосуточно | Фразы и выражения
die Stunde | час | Существительные
die Leute | люди | Существительные
helfen | помогать | Глаголы
geben | давать; передавать | Глаголы
die Blume | цветок | Существительные
die Hexe | ведьма | Существительные
schenken | дарить, делать подарок | Глаголы
bis | до | Предлоги
durch | через | Предлоги
gegen | против | Предлоги
um | вокруг | Предлоги
nach | после | Предлоги
langweilig | скучный, нудный / скучно | Прилагательные
bleiben | оставаться | Глаголы
achtung | внимание! (осторожно) / уважение (почтение) | Фразы и выражения
die Wand | стена | Существительные
herum | вокруг, кругом, около | Наречия
ab | с (будущее) | Предлоги
seit | с (прошлое) | Предлоги
außer | кроме | Предлоги
gegenüber | напротив | Предлоги
können | мочь, уметь | Глаголы
wollen | хотеть, желать, намереваться | Глаголы
der Unterricht | урок, занятие | Существительные
Französisch | французский | Прилагательные
die Brille | очки | Существительные
die Reise | путешествие | Существительные
immer | всегда | Наречия
überhaupt | вообще, совсем | Наречия
nehmen | брать; взять | Глаголы
endlich | наконец | Наречия
lieber | лучше (предпочтительнее) | Наречия
die Lebensmittel | продукты | Существительные
stehen | стоять | Глаголы
rufen | звать | Глаголы
manchmal | иногда, порой | Наречия
holen | приносить, приводить | Глаголы
natürlich | конечно, естественно | Наречия
aufmachen | открывать | Глаголы
zumachen | закрыть | Глаголы
das Fenster | окно, витрина | Существительные
die Tür | дверь | Существительные
anfangen | начинать | Глаголы
öffnen | открывать, отворять | Глаголы
schließen | закрывать, затворять | Глаголы
beginnen | начинать, начинаться | Глаголы
`;
  const seen = new Set();
  const ALL = RAW.trim().split("\n").map(l => {
    const [de, ru, cat] = l.split(" | ");
    return { de: de.trim(), ru: ru.trim(), cat: (cat || "").trim() };
  }).filter(w => !seen.has(w.de) && seen.add(w.de));

  // Наборы в выпадающем списке. Пустые категории скрываются сами.
  const CATEGORIES = ["Существительные", "Прилагательные", "Глаголы", "Местоимения",
                      "Наречия", "Предлоги", "Числительные", "Фразы и выражения"];
  const DECKS = { "📚 Все слова (уникальные)": ALL };
  CATEGORIES.forEach(c => {
    const list = ALL.filter(w => w.cat === c);
    if (list.length) DECKS[c + " (" + list.length + ")"] = list;
  });

  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#2a1259"); tg.setBackgroundColor("#140a2b"); } catch (e) {} }

  const $ = id => document.getElementById(id);
  const card = $("card"), deckSel = $("deck");
  let words = [], i = 0;

  Object.keys(DECKS).forEach(name => deckSel.add(new Option(name, name)));

  function loadDeck() { words = DECKS[deckSel.value].slice(); i = 0; render(); }

  function render() {
    card.classList.remove("flipped", "enter");
    void card.offsetWidth;
    card.classList.add("enter");
    $("de").textContent = words[i].de;
    $("ru").textContent = words[i].ru;
    document.documentElement.style.setProperty("--h", (i * 7) % 360);
    $("counter").textContent = (i + 1) + " / " + words.length;
    $("prev").disabled = i === 0;
    $("next").disabled = i === words.length - 1;
  }

  function go(step) {
    const n = i + step;
    if (n < 0 || n >= words.length) return;
    i = n; render();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }
  const flip = () => card.classList.toggle("flipped");

  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  card.onclick = flip;
  deckSel.onchange = loadDeck;
  $("shuffle").onclick = () => {
    for (let k = words.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [words[k], words[j]] = [words[j], words[k]]; }
    i = 0; render();
  };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  });

  // Свайп влево/вправо
  let x0 = null;
  card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 60) { go(dx < 0 ? 1 : -1); card._swiped = true; setTimeout(() => card._swiped = false, 50); }
    x0 = null;
  });
  card.addEventListener("click", e => { if (card._swiped) { e.stopImmediatePropagation(); } }, true);

  // Немецкие буквы на фоне: только в боковых полях
  const chars = ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü", "der", "die", "das", "ja", "nein"];
  for (let k = 0; k < 12; k++) {
    const s = document.createElement("span");
    s.className = "letter";
    s.textContent = chars[k % chars.length];
    const left = k % 2 ? Math.random() * 9 : 90 + Math.random() * 6;
    s.style.left = left + "%";
    s.style.fontSize = 26 + Math.random() * 26 + "px";
    s.style.animationDuration = 40 + Math.random() * 30 + "s";
    s.style.animationDelay = -Math.random() * 60 + "s";
    $("bg").appendChild(s);
  }

  // Переключатель фона: спокойный (по умолчанию) / яркий
  let vivid = false;
  try { vivid = localStorage.getItem("bg") === "vivid"; } catch (e) {}
  function applyBg() {
    document.body.classList.toggle("calm", !vivid);
    $("bgBtn").textContent = vivid ? "🌙 Спокойный фон" : "✨ Яркий фон";
  }
  $("bgBtn").onclick = () => {
    vivid = !vivid;
    try { localStorage.setItem("bg", vivid ? "vivid" : "calm"); } catch (e) {}
    applyBg();
  };
  applyBg();

  loadDeck();
</script>
</body>
</html>
