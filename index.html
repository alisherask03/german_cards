<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Немецкий язык: Полный гид и тесты (A1–C1)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #140d24;
    --paper: #ffffff;
    --pink: #ff3d8b;
    --amber: #ffb627;
    --teal: #19d3c5;
    --violet: #7c3aed;
    --tab-h: 74px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    background: #0f071e;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 14px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px));
  }

  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0f071e; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(75px); opacity: 0.35; }
  .b1 { width: 350px; height: 350px; top: -100px; left: -100px; background: #7c3aed; }
  .b2 { width: 380px; height: 380px; bottom: -120px; right: -120px; background: #19d3c5; }

  header, main, .screen { position: relative; z-index: 2; width: 100%; max-width: 480px; }

  h1 {
    font-size: 21px; margin: 2px 0 12px; text-align: center;
    color: #ffffff; text-shadow: 0 2px 8px rgba(124,58,237,0.6);
  }

  .filters { display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px; margin-bottom: 8px; }
  select, input[type="search"], input[type="text"] {
    width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.25); background: #1c1135;
    color: #ffffff; font-size: 15px; outline: none;
  }
  select option { background: #1c1135; color: #ffffff; }
  select:focus, input:focus { border-color: var(--teal); }

  #results {
    margin-top: 6px; max-height: 38vh; overflow-y: auto; border-radius: 14px;
    background: #180e30; border: 1.5px solid rgba(255,255,255,0.2);
  }
  #results button {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    min-height: 46px; text-align: left; padding: 10px 14px; background: none; border: 0;
    border-bottom: 1px solid rgba(255,255,255,0.1); color: #ffffff; font-size: 14px; cursor: pointer;
  }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: rgba(25,211,197,0.2); font-weight: 700; color: #19d3c5; }

  .stat { text-align: center; font-size: 13px; color: #e2e8f0; margin-top: 6px; font-weight: 600; }
  #bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,0.15); margin: 6px 0 12px; overflow: hidden; }
  #fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--amber), var(--pink)); transition: width 0.4s; }

  main { display: flex; flex-direction: column; gap: 12px; }
  .scene { position: relative; width: 100%; height: clamp(210px, 30vh, 260px); perspective: 1200px; }
  .fab {
    position: absolute; top: 12px; right: 12px; z-index: 6; width: 48px; height: 48px;
    border-radius: 50%; border: 3px solid var(--ink); background: var(--teal);
    font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .card-lvl {
    position: absolute; top: 14px; left: 16px; z-index: 4; font-size: 12px; font-weight: 800;
    padding: 4px 10px; border-radius: 10px; background: #f3f4f6; color: var(--ink);
  }
  .card {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1); cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  .front { background: #ffffff; color: var(--ink); border: 5px solid var(--art, var(--ink)); }
  .back { background: linear-gradient(135deg, #ffb627, #ff3d8b); color: var(--ink); border: 5px solid var(--art, var(--ink)); transform: rotateY(180deg); }
  .word { font-size: clamp(24px, 7.5vw, 38px); font-weight: 900; line-height: 1.15; word-break: break-word; color: #140d24; }
  .hint { margin-top: 12px; font-size: 13px; color: #6b7280; font-weight: 600; }

  nav, .know { display: flex; align-items: center; gap: 10px; width: 100%; }
  .btn {
    flex: 1; min-height: 52px; padding: 12px 8px; font-size: 16px; font-weight: 800; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 16px; cursor: pointer; box-shadow: 0 5px 0 var(--ink);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: 0.45; }
  .prev { background: var(--teal); }
  .next { background: var(--amber); }
  .again { background: var(--pink); color: #ffffff; }
  .knowb { background: #3ddc84; }
  .counter { min-width: 82px; text-align: center; font-weight: 800; font-size: 15px; color: #ffffff; }
  .legend { font-size: 12px; color: #cbd5e1; text-align: center; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool-btn {
    min-height: 46px; padding: 10px; background: #1c1135;
    border: 1.5px solid rgba(255,255,255,0.25); color: #ffffff; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tool-btn:active { background: #2a1a4a; }

  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 5px;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
    background: #0b0517; border-top: 1px solid rgba(255,255,255,0.15);
  }
  #tabs button {
    flex: 1; max-width: 95px; min-height: 52px; border-radius: 12px;
    border: 2px solid transparent; background: none; color: #94a3b8;
    font-size: 11px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #tabs button.on { background: rgba(25,211,197,0.15); border-color: var(--teal); color: var(--teal); }

  /* Грамматика */
  details.gr-card {
    background: #180e30; border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 16px; margin-bottom: 12px; overflow: hidden; color: #ffffff;
  }
  details.gr-card summary {
    padding: 16px; font-size: 16px; font-weight: 800; cursor: pointer;
    list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 54px;
  }
  details.gr-card[open] summary { border-bottom: 1px solid rgba(255,255,255,0.15); color: var(--amber); }
  .gr-body { padding: 16px; font-size: 14px; line-height: 1.6; color: #e2e8f0; }
  .gr-body h4 { margin: 14px 0 6px; color: var(--teal); font-size: 15px; }
  .gr-body p { margin: 6px 0; }
  .tbl-wrap { overflow-x: auto; margin: 10px 0; }
  table.gtbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 320px; color: #ffffff; }
  table.gtbl th, table.gtbl td { border: 1px solid rgba(255,255,255,0.2); padding: 8px 10px; text-align: left; }
  table.gtbl th { background: rgba(255,255,255,0.1); color: var(--amber); }
  .ex-box { background: rgba(25,211,197,0.12); border-left: 3px solid var(--teal); padding: 10px 12px; border-radius: 8px; margin: 10px 0; color: #ffffff; }

  /* Тесты */
  .test-box { background: #180e30; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .test-q { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #fff; }
  .test-opt { display: block; width: 100%; padding: 10px 14px; margin: 6px 0; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.25); background: #22153f; color: #fff; text-align: left; font-size: 14px; cursor: pointer; font-weight: 600; }
  .test-opt.correct { background: #1f9d55 !important; border-color: #3ddc84 !important; }
  .test-opt.wrong { background: #b3263e !important; border-color: #ff5a73 !important; }

  /* ИИ-чат */
  .ai-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  #chatLog {
    min-height: 38vh; max-height: 48vh; overflow-y: auto; padding: 12px;
    border-radius: 18px; background: #160c2b; border: 1.5px solid rgba(255,255,255,0.2);
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { padding: 12px 14px; border-radius: 16px; max-width: 88%; font-size: 14px; line-height: 1.5; color: #ffffff; }
  .msg.me { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: #261647; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .tip { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.3); font-size: 12.5px; color: var(--amber); }
  .msg .ru-tr { display: block; margin-top: 4px; font-size: 12.5px; color: #cbd5e1; }
  .quick-replies { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chip {
    white-space: nowrap; min-height: 38px; padding: 6px 12px; border-radius: 20px;
    background: #21133f; border: 1px solid rgba(255,255,255,0.25);
    color: #ffffff; font-size: 13px; cursor: pointer;
  }
  .ai-input-row { display: flex; gap: 8px; margin-top: 6px; }
  .ai-send { min-width: 54px; min-height: 48px; border-radius: 14px; border: 0; background: var(--teal); color: var(--ink); font-size: 18px; font-weight: 900; cursor: pointer; }

  /* Модальное окно */
  #modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,5,24,0.9);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .sheet {
    width: 100%; max-width: 460px; max-height: 85dvh; overflow-y: auto;
    background: #1c1135; border: 2px solid rgba(255,255,255,0.25); border-radius: 22px; padding: 18px; color: #ffffff;
  }
  .opt {
    display: block; width: 100%; min-height: 50px; margin: 8px 0; padding: 12px;
    font-size: 16px; font-weight: 700; border-radius: 14px; border: 2px solid rgba(255,255,255,0.25);
    background: #261647; color: #ffffff; cursor: pointer; text-align: left;
  }
  .opt.ok { background: #1f9d55; border-color: #3ddc84; }
  .opt.bad { background: #b3263e; border-color: #ff5a73; }
</style>
</head>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<header id="hdr">
  <h1>🇩🇪 Тренажёр и Тесты (A1–C1)</h1>

      <option value="A2">Уровень A2</option>
      <option value="B1">Уровень B1</option>
      <option value="B2">Уровень B2</option>
      <option value="C1">Уровень C1</option>
    </select>
    <select id="catSel" aria-label="Категория"></select>
  </div>
  <input id="q" type="search" placeholder="🔍 Поиск по базе слов (DE / RU)..." autocomplete="off">
  <div id="results" hidden></div>
  <div id="prog" class="stat"></div>
  <div id="bar"><i id="fill"></i></div>
</header>

<main id="main">
  <div class="scene">
    <button class="fab" id="speak" aria-label="Озвучить">🔊</button>
    <div class="card" id="card">
      <div class="face front">
        <span class="card-lvl" id="cardLvl">A1</span>
        <div class="word" id="de"></div>
        <div class="hint">Нажмите на карточку для перевода</div>
      </div>
      <div class="face back">
        <div class="word" id="ru"></div>
      </div>
    </div>
  </div>
  <nav>
    <button class="btn prev" id="prev">← Назад</button>
    <div class="counter" id="counter">0 / 0</div>
    <button class="btn next" id="next">Вперёд →</button>
  </nav>
  <div class="know">
    <button class="btn again" id="again">😕 Повторить</button>
    <button class="btn knowb" id="know">✅ Знаю</button>
  </div>
  <div class="legend">🔵 der (м.р.) · 🔴 die (ж.р.) · 🟢 das (ср.р.)</div>
  <div class="tools">
    <button class="tool-btn" id="dirBtn">🇩🇪 → 🇷🇺</button>
    <button class="tool-btn" id="shuffle">🔀 Перемешать</button>
    <button class="tool-btn" id="quizBtn">🎯 Мини-тест</button>
    <button class="tool-btn" id="guideBtn">📖 Правила чтения</button>
  </div>
</main>

<section id="gr" class="screen" hidden>
  <h1>📘 Глубокий справочник грамматики</h1>
  <div id="grContent"></div>
</section>

<section id="ts" class="screen" hidden>
  <h1>📝 Интерактивные тесты базы</h1>
  <div style="margin-bottom: 12px; font-size: 13px; color: #cbd5e1; text-align: center;">Проверьте свои знания по грамматике и лексике уровней A1–C1:</div>
  <div id="testsContainer"></div>
</section>

<section id="ai" class="screen" hidden>
  <h1>💬 ИИ-собеседник</h1>
  <div class="ai-controls">
    <select id="aiPersona">
      <option value="Hannah">👩 Hannah (Собеседница)</option>
      <option value="Lukas">👨 Lukas (Собеседник)</option>
    </select>
    <select id="aiTopic">
      <option value="intro">👋 Знакомство и о себе (A1)</option>
      <option value="cafe">☕ В ресторане / кафе (A1-A2)</option>
      <option value="shop">🛍 Покупки и сервис (A2)</option>
      <option value="work">💼 Карьера и собеседование (B1)</option>
      <option value="society">🌍 Общество и дискуссия (B2-C1)</option>
    </select>
  </div>
  <div id="chatLog"></div>
  <div class="quick-replies" id="quickReplies"></div>
  <div class="ai-input-row">
    <input type="text" id="aiInput" placeholder="Напишите ответ по-немецки...">
    <button class="ai-send" id="aiSend">➤</button>
  </div>
</section>

<section id="me" class="screen" hidden>
  <h1>👤 Ваш личный прогресс</h1>
  <div id="meStats"></div>
</section>

<div id="tabs">
  <button data-t="w" class="on">📇<span>Слова</span></button>
  <button data-t="g">📘<span>Грамматика</span></button>

</div>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

const WORDS = RAW.trim().split('\n').map((line, i) => {
  const [de = '', ru = '', cat = 'Разное', lvl = 'A1'] = line.split('|').map(s => s.trim());
  return { id: i, de, ru, cat: cat || 'Разное', lvl: lvl || 'A1' };
}).filter(w => w.de && w.ru);

let knownSet = new Set(JSON.parse(localStorage.getItem('de_known') || '[]'));
let deck = [...WORDS];
let idx = 0;
let rev = false;

const $ = id => document.getElementById(id);

function saveKnown() {
  localStorage.setItem('de_known', JSON.stringify([...knownSet]));
  updateProgress();
}

function updateProgress() {
  const total = WORDS.length;
  const done = WORDS.filter(w => knownSet.has(w.de)).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  $('prog').textContent = `Выучено: ${done} из ${total} (${pct}%)`;
  $('fill').style.width = pct + '%';
}

function populateCategories() {
  const cats = ['Все категории', ...new Set(WORDS.map(w => w.cat))];
  $('catSel').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function filterDeck() {
  const lvl = $('lvlSel').value;
  const cat = $('catSel').value;
  deck = WORDS.filter(w => (lvl === 'ALL' || w.lvl === lvl) && (cat === 'Все категории' || w.cat === cat));
  if (!deck.length) deck = [...WORDS];
  idx = 0;
  renderCard();
}

function getArticleColor(word) {
  const low = word.toLowerCase();
  if (low.startsWith('der ')) return '#3b82f6';
  if (low.startsWith('die ')) return '#ff3d8b';
  if (low.startsWith('das ')) return '#22c55e';
  return '#140d24';
}

function renderCard() {
  const card = $('card');
  card.classList.remove('flipped');
  const w = deck[idx];
  if (!w) return;
  const color = getArticleColor(w.de);
  document.documentElement.style.setProperty('--art', color);
  $('cardLvl').textContent = `${w.lvl} · ${w.cat}`;
  $('de').textContent = rev ? w.ru : w.de;
  $('ru').textContent = rev ? w.de : w.ru;
  $('counter').textContent = `${idx + 1} / ${deck.length}`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx >= deck.length - 1;
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, ''));
  u.lang = 'de-DE';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

$('card').onclick = () => $('card').classList.toggle('flipped');
$('speak').onclick = e => { e.stopPropagation(); speakText(deck[idx].de); };
$('prev').onclick = () => { if (idx > 0) { idx--; renderCard(); } };
$('next').onclick = () => { if (idx < deck.length - 1) { idx++; renderCard(); } };
$('know').onclick = () => { knownSet.add(deck[idx].de); saveKnown(); if (idx < deck.length - 1) idx++; renderCard(); };
$('again').onclick = () => { knownSet.delete(deck[idx].de); saveKnown(); if (idx < deck.length - 1) idx++; renderCard(); };
$('lvlSel').onchange = filterDeck;
$('catSel').onchange = filterDeck;
$('dirBtn').onclick = () => { rev = !rev; $('dirBtn').textContent = rev ? '🇷🇺 → 🇩🇪' : '🇩🇪 → 🇷🇺'; renderCard(); };
$('shuffle').onclick = () => { deck.sort(() => Math.random() - 0.5); idx = 0; renderCard(); };

$('q').oninput = e => {
  const val = e.target.value.trim().toLowerCase();
  const res = $('results');
  if (!val) { res.hidden = true; return; }
  const found = WORDS.filter(w => w.de.toLowerCase().includes(val) || w.ru.toLowerCase().includes(val)).slice(0, 25);
  res.hidden = false;
  res.innerHTML = found.length
    ? found.map(w => `<button onclick="jumpTo(${w.id})"><span><b>${w.de}</b> — ${w.ru}</span><span class="badge">${w.lvl}</span></button>`).join('')
    : '<div style="padding:12px;opacity:.7">Ничего не найдено</div>';
};

window.jumpTo = id => {
  $('lvlSel').value = 'ALL';
  $('catSel').value = 'Все категории';
  deck = [...WORDS];
  idx = deck.findIndex(w => w.id === id);
  $('results').hidden = true;
  $('q').value = '';
  renderCard();
};

$('quizBtn').onclick = () => {
  const target = deck[Math.floor(Math.random() * deck.length)];
  const opts = [target];
  while (opts.length < 4 && opts.length < WORDS.length) {
    const r = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (!opts.includes(r)) opts.push(r);
  }
  opts.sort(() => Math.random() - 0.5);
  $('sheet').innerHTML = `
    <h2 style="margin-top:0">🎯 Как переводится:</h2>
    <div style="font-size:28px;font-weight:900;text-align:center;margin:16px 0;color:var(--amber)">${target.de}</div>
    ${opts.map(o => `<button class="opt" onclick="checkQuiz(this, ${o.id === target.id})">${o.ru}</button>`).join('')}
    <button class="tool-btn" style="width:100%;margin-top:12px" onclick="$('modal').hidden=true">Закрыть</button>
  `;
  $('modal').hidden = false;
};

window.checkQuiz = (btn, ok) => {
  btn.classList.add(ok ? 'ok' : 'bad');
  if (ok) speakText(deck[idx].de);
};

$('guideBtn').onclick = () => {
  $('sheet').innerHTML = `
    <h2 style="margin-top:0">📖 Правила чтения в немецком</h2>
    <p><b>ei</b> → [ай]: <i>mein, eins</i></p>
    <p><b>ie</b> → [и:]: <i>sie, lieben</i></p>
    <p><b>eu / äu</b> → [ой]: <i>heute, Häuser</i></p>

let aiTurn = 0;

function checkGermanErrors(text) {
  const tips = [];
  if (/\bich habe \d+ jahre/i.test(text)) {
    tips.push('💡 Подсказка: возраст выражается через глагол <b>sein</b>: <i>Ich bin ... Jahre alt</i>.');
  }
  return tips.join(' ');
}

function initAI() {
  const persona = $('aiPersona').value;
  const topic = AI_SCENARIOS[$('aiTopic').value];
  aiTurn = 0;
  const startDe = topic.start.de.replace('{name}', persona);
  const startRu = topic.start.ru.replace('{name}', persona);
  $('chatLog').innerHTML = `
    <div class="msg bot">
      <b>${persona}:</b> ${startDe}
      <span class="ru-tr">${startRu}</span>
    </div>
  `;
  $('quickReplies').innerHTML = topic.chips.map(c => `<button class="chip" onclick="sendAI('${c}')">${c}</button>`).join('');
}

window.sendAI = (preset) => {
  const input = $('aiInput');
  const text = (preset || input.value).trim();
  if (!text) return;
  input.value = '';

  const tip = checkGermanErrors(text);
  const log = $('chatLog');
  log.innerHTML += `
    <div class="msg me">
      ${text}
      ${tip ? `<div class="tip">${tip}</div>` : ''}
    </div>
  `;

  const persona = $('aiPersona').value;
  const topic = AI_SCENARIOS[$('aiTopic').value];
  const reply = topic.replies[aiTurn % topic.replies.length];
  aiTurn++;

  setTimeout(() => {
    log.innerHTML += `
      <div class="msg bot">
        <b>${persona}:</b> ${reply.de}
        <span class="ru-tr">${reply.ru}</span>
      </div>
    `;
    log.scrollTop = log.scrollHeight;
    speakText(reply.de);
  }, 350);
  log.scrollTop = log.scrollHeight;
};

$('aiSend').onclick = () => sendAI();
$('aiInput').onkeydown = e => { if (e.key === 'Enter') sendAI(); };
$('aiPersona').onchange = initAI;
$('aiTopic').onchange = initAI;

function renderMe() {
  const lvls = ['A1', 'A2', 'B1', 'B2', 'C1'];
  $('meStats').innerHTML = lvls.map(l => {
    const all = WORDS.filter(w => w.lvl === l);
    const done = all.filter(w => knownSet.has(w.de)).length;
    const pct = all.length ? Math.round((done / all.length) * 100) : 0;
    return `
      <div style="background:#180e30;padding:14px;border-radius:16px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.2)">
        <div style="display:flex;justify-content:space-between;font-weight:800">
          <span>Уровень ${l}</span><span>${done} / ${all.length} (${pct}%)</span>
        </div>
        <div style="height:8px;background:rgba(255,255,255,0.15);border-radius:8px;margin-top:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--teal)"></div>
        </div>
      </div>
    `;
  }).join('') + `<button class="tool-btn" style="width:100%;margin-top:10px" onclick="if(confirm('Сбросить весь прогресс?')){knownSet.clear();saveKnown();renderMe();}">🗑 Сбросить прогресс</button>`;
}

document.querySelectorAll('#tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const t = btn.dataset.t;
    $('hdr').hidden = t !== 'w';
    $('main').hidden = t !== 'w';
    $('gr').hidden = t !== 'g';
    $('ts').hidden = t !== 't';
    $('ai').hidden = t !== 'a';
    $('me').hidden = t !== 'p';
    if (t === 'p') renderMe();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});

populateCategories();
updateProgress();
renderCard();
initAI();
</script>
