        body {

            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            box-sizing: border-box;
        }
        h2 {
            margin: 5px 0 15px 0;
            font-size: 22px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .category-select {
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        select option {
            background: #2575fc;
            color: #fff;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 320px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
            box-sizing: border-box;
        }
        .card:active {
            transform: scale(0.98);
        }
        .word-de {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            word-break: break-word;
        }
        .word-ru {
            font-size: 20px;
            color: #27ae60;
            display: none;
            margin-top: 10px;
            font-weight: 500;
            word-break: break-word;
        }
        .card.show .word-ru {
            display: block;
        }
        .hint {
            margin-top: 25px;
            font-size: 13px;
            color: #95a5a6;
        }
        .counter {
            margin-top: 15px;
            font-size: 14px;

        let currentWords = [...allWords];
        let currentIndex = 0;
        let showTranslation = false;

        function changeCategory() {
            const select = document.getElementById('categorySelect');
            const cat = select.value;
            
            if (cat === 'all') {
                currentWords = [...allWords];
            } else {
                currentWords = allWords.filter(w => w.cat === cat);
            }
            
            currentIndex = 0;
            showTranslation = false;
            updateCard();
        }

        function updateCard() {
            const card = document.getElementById('card');
            const deEl = document.getElementById('de');
            const ruEl = document.getElementById('ru');
            const counterEl = document.getElementById('counter');

            if (currentWords.length === 0) {
                deEl.textContent = "Нет слов";
                ruEl.textContent = "";
                counterEl.textContent = "0 / 0";
                return;
            }

            deEl.textContent = currentWords[currentIndex].de;
            ruEl.textContent = currentWords[currentIndex].ru;
            counterEl.textContent = `${currentIndex + 1} / ${currentWords.length}`;
            
            if (showTranslation) {
                card.classList.add('show');
            } else {
                card.classList.remove('show');
            }
        }

        function nextCard() {
            if (currentWords.length === 0) return;

            if (!showTranslation) {
                showTranslation = true;
            } else {
                showTranslation = false;
                currentIndex = (currentIndex + 1) % currentWords.length;
            }
            updateCard();
        }

        updateCard();

</html>
