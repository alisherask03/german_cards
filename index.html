<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Немецкий тренажёр A1–B1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #1c1233;
    --paper: #fffaf0;
    --pink: #ff3d8b;
    --amber: #ffb627;
    --teal: #19d3c5;
    --violet: #6a3dff;
    --tab-h: 74px;
    --h: 0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: #140a2b;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 14px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom, 0px));
  }

  /* Фон */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #130828; pointer-events: none; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 50% at 50% 45%, rgba(15,7,32,.92) 0%, rgba(15,7,32,.65) 60%, transparent 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(55px); opacity: .65; animation: drift 24s ease-in-out infinite alternate; }
  .b1 { width: 320px; height: 320px; top: -100px; left: -100px; background: hsl(calc(var(--h) + 330), 95%, 58%); }
  .b2 { width: 340px; height: 340px; bottom: -110px; right: -110px; background: hsl(calc(var(--h) + 175), 90%, 50%); animation-delay: -8s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(35px,25px) scale(1.15); } }

  header, main, .screen { position: relative; z-index: 1; width: 100%; max-width: 480px; }
  header[hidden], main[hidden], .screen[hidden] { display: none !important; }

  h1 { font-size: 22px; margin: 2px 0 10px; text-align: center; text-shadow: 0 2px 0 rgba(255,61,139,.55); }

  /* Фильтры и поиск */
  .filters { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-bottom: 8px; }
  select, input[type="search"], input[type="text"] {
    width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.25); background: rgba(20,10,43,.75);
    color: #fff; font-size: 15px; outline: none;
  }
  select:focus, input:focus { border-color: var(--teal); }
  #results {
    margin-top: 6px; max-height: 36vh; overflow-y: auto; border-radius: 14px;
    background: rgba(20,10,43,.95); border: 1px solid rgba(255,255,255,.2);
  }
  #results button {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    min-height: 46px; text-align: left; padding: 10px 14px; background: none; border: 0;
    border-bottom: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 14px; cursor: pointer;
  }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 8px; background: rgba(255,255,255,.16); font-weight: 700; }

  .stat { text-align: center; font-size: 13px; opacity: .88; margin-top: 6px; }
  #bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.15); margin: 6px 0 12px; overflow: hidden; }
  #fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--amber), var(--pink)); transition: width .4s; }

  /* Карточка */
  main { display: flex; flex-direction: column; gap: 12px; }
  .scene { position: relative; width: 100%; height: clamp(195px, 28vh, 240px); perspective: 1200px; }
  .fab {
    position: absolute; top: 10px; right: 10px; z-index: 5; width: 50px; height: 50px;
    border-radius: 50%; border: 3px solid var(--ink); background: var(--teal);
    font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
  }
  .fab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .card-lvl {
    position: absolute; top: 12px; left: 14px; z-index: 4; font-size: 12px; font-weight: 800;
    padding: 4px 9px; border-radius: 10px; background: rgba(28,18,51,.12); color: var(--ink);
  }
  .card {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.3,1.4,.5,1); cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; box-shadow: 0 12px 28px rgba(0,0,0,.35);
  }
  .front { background: var(--paper); color: var(--ink); border: 5px solid var(--art, var(--ink)); }
  .back { background: linear-gradient(135deg, var(--amber), var(--pink)); color: var(--ink); border: 5px solid var(--art, var(--ink)); transform: rotateY(180deg); }
  .word { font-size: clamp(26px, 8vw, 42px); font-weight: 900; line-height: 1.15; word-break: break-word; }
  .hint { margin-top: 12px; font-size: 13px; opacity: .6; }

  /* Кнопки управления */
  nav, .know { display: flex; align-items: center; gap: 10px; width: 100%; }
  .btn {
    flex: 1; min-height: 52px; padding: 12px 8px; font-size: 16px; font-weight: 800; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 16px; cursor: pointer; box-shadow: 0 5px 0 var(--ink);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; }
  .prev { background: var(--teal); }
  .next { background: var(--amber); }
  .again { background: var(--pink); }
  .knowb { background: #3ddc84; }
  .counter { min-width: 78px; text-align: center; font-weight: 800; font-size: 15px; }
  .legend { font-size: 12px; opacity: .85; text-align: center; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool-btn {
    min-height: 46px; padding: 10px; background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.3); color: #fff; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .tool-btn:active { background: rgba(255,255,255,.18); }

  /* Нижняя панель навигации */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 6px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    background: rgba(15,7,32,.97); border-top: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(10px);
  }
  #tabs button {
    flex: 1; max-width: 120px; min-height: 52px; border-radius: 14px;
    border: 2px solid transparent; background: none; color: #fff;
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #tabs button.on { background: rgba(255,255,255,.15); border-color: var(--teal); color: var(--teal); }

  /* Грамматика (аккордеон и таблицы) */
  details.gr-card {
    background: rgba(28,18,51,.88); border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 16px; margin-bottom: 10px; overflow: hidden;
  }
  details.gr-card summary {
    padding: 15px 16px; font-size: 16px; font-weight: 800; cursor: pointer;
    list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 54px;
  }
  details.gr-card[open] summary { border-bottom: 1px solid rgba(255,255,255,.15); color: var(--amber); }
  .gr-body { padding: 14px 16px; font-size: 14px; line-height: 1.55; }
  .gr-body h4 { margin: 12px 0 6px; color: var(--teal); font-size: 15px; }
  .gr-body p { margin: 6px 0; }
  .tbl-wrap { overflow-x: auto; margin: 8px 0; }
  table.gtbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 300px; }
  table.gtbl th, table.gtbl td { border: 1px solid rgba(255,255,255,.22); padding: 7px 8px; text-align: left; }
  table.gtbl th { background: rgba(255,255,255,.12); color: var(--amber); }
  .ex-box { background: rgba(25,211,197,.12); border-left: 3px solid var(--teal); padding: 8px 10px; border-radius: 8px; margin: 8px 0; }

  /* ИИ-собеседник */
  .ai-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  #chatLog {
    min-height: 38vh; max-height: 48vh; overflow-y: auto; padding: 10px;
    border-radius: 18px; background: rgba(20,10,43,.82); border: 1.5px solid rgba(255,255,255,.18);
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { padding: 11px 14px; border-radius: 16px; max-width: 88%; font-size: 14px; line-height: 1.45; }
  .msg.me { background: #3b82f6; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: rgba(255,255,255,.14); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .tip { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,.25); font-size: 12.5px; color: var(--amber); }
  .msg .ru-tr { display: block; margin-top: 4px; font-size: 12.5px; opacity: .8; }
  .quick-replies { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chip {
    white-space: nowrap; min-height: 38px; padding: 6px 12px; border-radius: 20px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-size: 13px; cursor: pointer;
  }
  .ai-input-row { display: flex; gap: 8px; margin-top: 6px; }
  .ai-send { min-width: 54px; min-height: 48px; border-radius: 14px; border: 0; background: var(--teal); color: var(--ink); font-size: 18px; font-weight: 900; cursor: pointer; }

  /* Модальное окно (Тест / Как читать) */
  #modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,5,24,.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sheet { width: 100%; max-width: 460px; max-height: 85dvh; overflow-y: auto; background: #1c1233; border: 2px solid rgba(255,255,255,.25); border-radius: 22px; padding: 18px; }
  .opt { display: block; width: 100%; min-height: 50px; margin: 8px 0; padding: 12px; font-size: 16px; font-weight: 700; border-radius: 14px; border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; text-align: left; }
  .opt.ok { background: #1f9d55; border-color: #3ddc84; }
  .opt.bad { background: #b3263e; border-color: #ff5a73; }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<header id="hdr">
  <h1>🇩🇪 Немецкий тренажёр</h1>
  <div class="filters">
    <select id="lvlSel" aria-label="Уровень">
      <option value="ALL">Все уровни</option>
      <option value="A1">Уровень A1</option>
      <option value="A2">Уровень A2</option>
      <option value="B1">Уровень B1</option>
    </select>
    <select id="catSel" aria-label="Категория"></select>
  </div>
  <input id="q" type="search" placeholder="🔍 Поиск слова (DE / RU)..." autocomplete="off">
  <div id="results" hidden></div>
  <div id="prog" class="stat"></div>
  <div id="bar"><i id="fill"></i></div>
</header>

<main id="main">
  <div class="scene">
    <button class="fab" id="speak" aria-label="Озвучить">🔊</button>
    <div class="card" id="card">
      <div class="face front">
        <span class="card-lvl" id="cardLvl">A1</span>
        <div class="word" id="de"></div>
        <div class="hint">Нажмите на карточку для перевода</div>
      </div>
      <div class="face back">
        <div class="word" id="ru"></div>
      </div>
    </div>
  </div>
  <nav>
    <button class="btn prev" id="prev">← Назад</button>
    <div class="counter" id="counter">0 / 0</div>
    <button class="btn next" id="next">Вперёд →</button>
  </nav>
  <div class="know">
    <button class="btn again" id="again">😕 Повторить</button>
    <button class="btn knowb" id="know">✅ Знаю</button>
  </div>
  <div class="legend">🔵 der (м.р.) · 🔴 die (ж.р.) · 🟢 das (ср.р.)</div>
  <div class="tools">
    <button class="tool-btn" id="dirBtn">🇩🇪 → 🇷🇺</button>
    <button class="tool-btn" id="shuffle">🔀 Перемешать</button>
    <button class="tool-btn" id="quizBtn">🎯 Мини-тест</button>
    <button class="tool-btn" id="guideBtn">📖 Правила чтения</button>
  </div>
</main>

<section id="gr" class="screen" hidden>
  <h1>📘 Подробная грамматика</h1>
  <div id="grContent"></div>
</section>

<section id="ai" class="screen" hidden>
  <h1>💬 ИИ-собеседник</h1>
  <div class="ai-controls">
    <select id="aiPersona">
      <option value="Hannah">👩 Hannah (Собеседница)</option>
      <option value="Lukas">👨 Lukas (Собеседник)</option>
    </select>
    <select id="aiTopic">
      <option value="intro">👋 Знакомство (A1)</option>
      <option value="cafe">☕ В кафе / ресторане (A1)</option>
      <option value="shop">🛍 Покупки в магазине (A1–A2)</option>
      <option value="work">💼 Работа и учёба (A2)</option>
      <option value="travel">✈️ Путешествия и город (A2–B1)</option>
    </select>
  </div>
  <div id="chatLog"></div>
  <div class="quick-replies" id="quickReplies"></div>
  <div class="ai-input-row">
    <input type="text" id="aiInput" placeholder="Напишите ответ по-немецки...">
    <button class="ai-send" id="aiSend">➤</button>
  </div>
</section>

<section id="me" class="screen" hidden>
  <h1>👤 Ваш прогресс</h1>
  <div id="meStats"></div>
</section>

<div id="tabs">
  <button data-t="w" class="on">📇<span>Слова</span></button>
  <button data-t="g">📘<span>Грамматика</span></button>
  <button data-t="a">💬<span>ИИ-чат</span></button>
  <button data-t="p">👤<span>Прогресс</span></button>
</div>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
// Инициализация Telegram WebApp
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Формат: немецкое | перевод | категория | уровень
// Сюда вставляется полная база на 2000 слов
const RAW = `
fragen | спрашивать | Глаголы | A1
lieben | любить | Глаголы | A1
leben | жить | Глаголы | A1
heißen | называться | Глаголы | A1
sein | быть | Глаголы | A1
haben | иметь | Глаголы | A1
gehen | идти, ходить | Глаголы | A1
fahren | ехать | Глаголы | A1
sprechen | говорить | Глаголы | A1
lernen | учить, учиться | Глаголы | A1
arbeiten | работать | Глаголы | A1
machen | делать | Глаголы | A1
können | мочь, уметь | Глаголы | A1
wollen | хотеть | Глаголы | A1
müssen | быть должным | Глаголы | A1
dürfen | иметь разрешение | Глаголы | A1
der Mann | мужчина | Существительные | A1
die Frau | женщина | Существительные | A1
das Kind | ребёнок | Существительные | A1
das Haus | дом | Существительные | A1
die Wohnung | квартира | Существительные | A1
der Tisch | стол | Существительные | A1
das Buch | книга | Существительные | A1
der Freund | друг | Существительные | A1
die Arbeit | работа | Существительные | A1
die Stadt | город | Существительные | A1
gut | хороший, хорошо | Прилагательные | A1
schlecht | плохой, плохо | Прилагательные | A1
groß | большой | Прилагательные | A1
klein | маленький | Прилагательные | A1
neu | новый | Прилагательные | A1
alt | старый | Прилагательные | A1
schnell | быстрый | Прилагательные | A1
langsam | медленный | Прилагательные | A1
wichtig | важный | Прилагательные | A1
schwierig | сложный | Прилагательные | A2
erfolgreich | успешный | Прилагательные | B1
zuverlässig | надёжный | Прилагательные | B1
entscheiden | принимать решение | Глаголы | B1
empfehlen | рекомендовать | Глаголы | A2
die Erfahrung | опыт | Существительные | B1
die Verantwortung | ответственность | Существительные | B1
`;

// Парсинг словаря
const WORDS = RAW.trim().split('\n').map((line, i) => {
  const [de = '', ru = '', cat = 'Разное', lvl = 'A1'] = line.split('|').map(s => s.trim());
  return { id: i, de, ru, cat: cat || 'Разное', lvl: lvl || 'A1' };
}).filter(w => w.de && w.ru);

let knownSet = new Set(JSON.parse(localStorage.getItem('de_known') || '[]'));
let deck = [...WORDS];
let idx = 0;
let rev = false;

const $ = id => document.getElementById(id);

function saveKnown() {
  localStorage.setItem('de_known', JSON.stringify([...knownSet]));
  updateProgress();
}

function updateProgress() {
  const total = WORDS.length;
  const done = WORDS.filter(w => knownSet.has(w.de)).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  $('prog').textContent = `Выучено: ${done} из ${total} (${pct}%)`;
  $('fill').style.width = pct + '%';
}

function populateCategories() {
  const cats = ['Все категории', ...new Set(WORDS.map(w => w.cat))];
  $('catSel').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function filterDeck() {
  const lvl = $('lvlSel').value;
  const cat = $('catSel').value;
  deck = WORDS.filter(w => (lvl === 'ALL' || w.lvl === lvl) && (cat === 'Все категории' || w.cat === cat));
  if (!deck.length) deck = [...WORDS];
  idx = 0;
  renderCard();
}

function getArticleColor(word) {
  const low = word.toLowerCase();
  if (low.startsWith('der ')) return '#3b82f6';
  if (low.startsWith('die ')) return '#ff3d8b';
  if (low.startsWith('das ')) return '#22c55e';
  return '#1c1233';
}

function renderCard() {
  const card = $('card');
  card.classList.remove('flipped');
  const w = deck[idx];
  if (!w) return;
  const color = getArticleColor(w.de);
  document.documentElement.style.setProperty('--art', color);
  $('cardLvl').textContent = `${w.lvl} · ${w.cat}`;
  $('de').textContent = rev ? w.ru : w.de;
  $('ru').textContent = rev ? w.de : w.ru;
  $('counter').textContent = `${idx + 1} / ${deck.length}`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx >= deck.length - 1;
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, ''));
  u.lang = 'de-DE';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

// События карточек
$('card').onclick = () => $('card').classList.toggle('flipped');
$('speak').onclick = e => { e.stopPropagation(); speakText(deck[idx].de); };
$('prev').onclick = () => { if (idx > 0) { idx--; renderCard(); } };
$('next').onclick = () => { if (idx < deck.length - 1) { idx++; renderCard(); } };
$('know').onclick = () => { knownSet.add(deck[idx].de); saveKnown(); if (idx < deck.length - 1) idx++; renderCard(); };
$('again').onclick = () => { knownSet.delete(deck[idx].de); saveKnown(); if (idx < deck.length - 1) idx++; renderCard(); };
$('lvlSel').onchange = filterDeck;
$('catSel').onchange = filterDeck;
$('dirBtn').onclick = () => { rev = !rev; $('dirBtn').textContent = rev ? '🇷🇺 → 🇩🇪' : '🇩🇪 → 🇷🇺'; renderCard(); };
$('shuffle').onclick = () => { deck.sort(() => Math.random() - 0.5); idx = 0; renderCard(); };

// Поиск
$('q').oninput = e => {
  const val = e.target.value.trim().toLowerCase();
  const res = $('results');
  if (!val) { res.hidden = true; return; }
  const found = WORDS.filter(w => w.de.toLowerCase().includes(val) || w.ru.toLowerCase().includes(val)).slice(0, 25);
  res.hidden = false;
  res.innerHTML = found.length
    ? found.map(w => `<button onclick="jumpTo(${w.id})"><span><b>${w.de}</b> — ${w.ru}</span><span class="badge">${w.lvl}</span></button>`).join('')
    : '<div style="padding:12px;opacity:.7">Ничего не найдено</div>';
};
window.jumpTo = id => {
  $('lvlSel').value = 'ALL';
  $('catSel').value = 'Все категории';
  deck = [...WORDS];
  idx = deck.findIndex(w => w.id === id);
  $('results').hidden = true;
  $('q').value = '';
  renderCard();
};

// Мини-тест
$('quizBtn').onclick = () => {
  const target = deck[Math.floor(Math.random() * deck.length)];
  const opts = [target];
  while (opts.length < 4 && opts.length < WORDS.length) {
    const r = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (!opts.includes(r)) opts.push(r);
  }
  opts.sort(() => Math.random() - 0.5);
  $('sheet').innerHTML = `
    <h2>🎯 Как переводится:</h2>
    <div style="font-size:28px;font-weight:900;text-align:center;margin:16px 0;color:var(--amber)">${target.de}</div>
    ${opts.map(o => `<button class="opt" onclick="checkQuiz(this, ${o.id === target.id})">${o.ru}</button>`).join('')}
    <button class="tool-btn" style="width:100%;margin-top:12px" onclick="$('modal').hidden=true">Закрыть</button>
  `;
  $('modal').hidden = false;
};

let aiTurn = 0;

function checkGermanErrors(text) {
  const tips = [];
  if (/\bich bin \d+/i.test(text) && /jahre/i.test(text)) {
    tips.push('В немецком возраст говорят с глаголом <b>haben</b> или без него: <i>Ich bin 23 Jahre alt</i> (не <i>ich habe 23 Jahre</i>).');
  }
  if (/\bich habe \d+ jahre/i.test(text)) {
    tips.push('💡 Подсказка: возраст по-немецки выражается через <b>sein</b>: <i>Ich bin ... Jahre alt</i>.');
  }
  if (/\bich gehe nach berlin|\bich gehe nach deutschland/i.test(text)) {
    tips.push('💡 Подсказка: в другой город или страну лучше использовать глагол <b>fahren</b> (ехать) или <b>fliegen</b> (лететь) вместо <i>gehen</i> (идти пешком).');
  }
  if (/\bich möchte ein kaffee\b/i.test(text)) {
    tips.push('💡 Подсказка: <i>der Kaffee</i> — мужского рода, в Akkusativ (кого? что?) нужен артикль <b>einen</b>: <i>einen Kaffee</i>.');
  }
  if (text.trim().length > 0 && !/[.!?]$/.test(text.trim())) {
    tips.push('Совет: не забывайте знак препинания в конце предложения.');
  }
  return tips.join(' ');
}

function initAI() {
  const persona = $('aiPersona').value;
  const topic = AI_SCENARIOS[$('aiTopic').value];
  aiTurn = 0;
  const startDe = topic.start.de.replace('{name}', persona);
  const startRu = topic.start.ru.replace('{name}', persona);
  $('chatLog').innerHTML = `
    <div class="msg bot">
      <b>${persona}:</b> ${startDe}
      <span class="ru-tr">${startRu}</span>
    </div>
  `;
  $('quickReplies').innerHTML = topic.chips.map(c => `<button class="chip" onclick="sendAI('${c}')">${c}</button>`).join('');
}

window.sendAI = (preset) => {
  const input = $('aiInput');
  const text = (preset || input.value).trim();
  if (!text) return;
  input.value = '';

  const tip = checkGermanErrors(text);
  const log = $('chatLog');
  log.innerHTML += `
    <div class="msg me">
      ${text}
      ${tip ? `<div class="tip">${tip}</div>` : ''}
    </div>
  `;

  const persona = $('aiPersona').value;
  const topic = AI_SCENARIOS[$('aiTopic').value];
  const reply = topic.replies[aiTurn % topic.replies.length];
  aiTurn++;

  setTimeout(() => {
    log.innerHTML += `
      <div class="msg bot">
        <b>${persona}:</b> ${reply.de}
        <span class="ru-tr">${reply.ru}</span>
      </div>
    `;
    log.scrollTop = log.scrollHeight;
    speakText(reply.de);
  }, 350);
  log.scrollTop = log.scrollHeight;
};

$('aiSend').onclick = () => sendAI();
$('aiInput').onkeydown = e => { if (e.key === 'Enter') sendAI(); };
$('aiPersona').onchange = initAI;
$('aiTopic').onchange = initAI;

// Вкладки и экран прогресса
function renderMe() {
  const lvls = ['A1', 'A2', 'B1'];
  $('meStats').innerHTML = lvls.map(l => {
    const all = WORDS.filter(w => w.lvl === l);
    const done = all.filter(w => knownSet.has(w.de)).length;
    const pct = all.length ? Math.round((done / all.length) * 100) : 0;
    return `
      <div style="background:rgba(255,255,255,.08);padding:14px;border-radius:16px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-weight:800">
          <span>Уровень ${l}</span><span>${done} / ${all.length} (${pct}%)</span>
        </div>
        <div style="height:8px;background:rgba(255,255,255,.15);border-radius:8px;margin-top:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--teal)"></div>
        </div>
      </div>
    `;
  }).join('') + `<button class="tool-btn" style="width:100%;margin-top:10px" onclick="if(confirm('Сбросить весь прогресс?')){knownSet.clear();saveKnown();renderMe();}">🗑 Сбросить прогресс</button>`;
}
