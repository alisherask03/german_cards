<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Немецкие карточки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #1c1233;
    --paper: #fffaf0;
    --pink: #ff3d8b;
    --amber: #ffb627;
    --teal: #19d3c5;
    --violet: #6a3dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: #140a2b;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- Фон: цвет по краям, тишина в центре ---------- */
  :root { --h: 0; }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #130828; }
  /* тёмная «подушка» за карточкой, чтобы слово читалось на любом фоне */
  .bg::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 42% at 50% 48%, rgba(15,7,32,.92) 0%, rgba(15,7,32,.6) 55%, transparent 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(55px); opacity: .55;
    animation: drift 32s ease-in-out infinite alternate;
    transition: background-color 2s ease, opacity .6s; }
  .b1 { width: 340px; height: 340px; top: -110px;  left: -110px;  background: hsl(calc(var(--h) + 330), 95%, 58%); }
  .b2 { width: 360px; height: 360px; bottom: -120px; right: -120px; background: hsl(calc(var(--h) + 175), 90%, 50%); animation-delay: -9s; }
  .b3 { width: 280px; height: 280px; top: -90px;  right: -110px; background: hsl(calc(var(--h) + 40), 100%, 58%); animation-delay: -17s; }
  .b4 { width: 300px; height: 300px; bottom: -110px; left: -120px; background: hsl(calc(var(--h) + 260), 95%, 62%); animation-delay: -5s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.2); }
  }
  /* немецкие буквы плывут только вдоль краёв, не за карточкой */
  .letter { position: absolute; bottom: -60px; font-weight: 900; color: rgba(255,255,255,.07);
    animation: rise linear infinite; user-select: none; }
  @keyframes rise { to { transform: translateY(-125vh) rotate(25deg); } }
  /* яркий режим: насыщеннее и быстрее */
  body:not(.calm) .blob { opacity: .85; animation-duration: 14s; }
  body:not(.calm) .letter { color: rgba(255,255,255,.14); }
  .tools { position: relative; z-index: 1; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  #q { width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 16px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(20,10,43,.55); color: #fff; font-size: 16px; backdrop-filter: blur(8px); outline: none; }
  #q::placeholder { color: rgba(255,255,255,.55); }
  #results { margin-top: 8px; max-height: 34vh; overflow-y: auto; border-radius: 16px; background: rgba(20,10,43,.85); }
  #results button { display: block; width: 100%; text-align: left; padding: 10px 14px; background: none; border: 0;
    border-bottom: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 15px; cursor: pointer; }
  #results .none { padding: 10px 14px; opacity: .7; font-size: 15px; }
  .stat { text-align: center; font-size: 13px; opacity: .8; margin-top: 8px; }

  /* ---------- Layout ---------- */
  header, main, nav { position: relative; z-index: 1; width: 100%; max-width: 440px; }
  h1 { font-size: 26px; margin: 4px 0 14px; text-align: center; letter-spacing: .5px;
    text-shadow: 0 3px 0 rgba(255,61,139,.55); }
  select {
    width: 100%; padding: 13px 14px; border-radius: 16px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(20,10,43,.55); color: #fff; font-size: 16px; backdrop-filter: blur(8px);
    appearance: none; -webkit-appearance: none;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }

  /* ---------- Card ---------- */
  .scene { width: 100%; height: 250px; perspective: 1200px; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card.enter { animation: pop .4s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.85) rotate(-3deg); } }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; box-shadow: 0 18px 0 -6px rgba(0,0,0,.28), 0 28px 50px rgba(0,0,0,.35); }
  .front { background: var(--paper); color: var(--ink); border: 6px solid var(--art, var(--ink)); }
  .back  { background: linear-gradient(135deg, var(--amber), var(--pink)); color: var(--ink);
           border: 6px solid var(--art, var(--ink)); transform: rotateY(180deg); }
  .word { font-size: clamp(34px, 11vw, 52px); font-weight: 900; line-height: 1.1; word-break: break-word; }
  .hint { margin-top: 18px; font-size: 14px; opacity: .55; }

  /* ---------- Controls ---------- */
  nav { display: flex; align-items: center; gap: 12px; }
  .btn { flex: 1; padding: 16px 0; font-size: 18px; font-weight: 800; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px; cursor: pointer;
    box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; }
  .prev { background: var(--teal); }
  .next { background: var(--amber); }
  .counter { min-width: 76px; text-align: center; font-weight: 800; font-size: 17px; }
  .shuffle { position: relative; z-index: 1; margin-top: 14px; background: none; border: 2px dashed rgba(255,255,255,.4);
    color: #fff; border-radius: 14px; padding: 8px 16px; font-size: 14px; cursor: pointer; }

  .scene { position: relative; }
  .fab { position: absolute; top: -14px; right: -6px; z-index: 5; width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid var(--ink); background: var(--teal); font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  .fab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .know { display: flex; gap: 12px; width: 100%; }
  .again { background: var(--pink); } .knowb { background: #3ddc84; }
  .legend { font-size: 13px; opacity: .85; text-align: center; }
  #modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,5,24,.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; background: #1c1233; border: 2px solid rgba(255,255,255,.25); border-radius: 22px; padding: 20px; }
  .sheet h2 { margin: 0 0 12px; } .sheet p { margin: 6px 0; font-size: 15px; line-height: 1.35; }
  .qw { font-size: 30px; font-weight: 900; text-align: center; margin: 14px 0; }
  .opt { display: block; width: 100%; margin: 8px 0; padding: 13px; font-size: 17px; font-weight: 700; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; }
  .opt.ok { background: #1f9d55; border-color: #3ddc84; } .opt.bad { background: #b3263e; border-color: #ff5a73; }
  @media (prefers-reduced-motion: reduce) { .blob, .letter, .card, .card.enter { animation: none; transition: none; } }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<header>
  <h1>🇩🇪 Немецкие карточки</h1>
  <select id="deck" aria-label="Набор слов"></select>
  <input id="q" type="search" placeholder="🔍 Поиск: по-немецки или по-русски" autocomplete="off">
  <div id="results" hidden></div>
  <div id="stat" class="stat" hidden></div>
  <div id="prog" class="stat"></div>
</header>

<main>
  <div class="scene">
    <button class="fab" id="speak" aria-label="Озвучить">🔊</button>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку">
      <div class="face front"><div class="word" id="de"></div><div class="hint">Нажмите, чтобы увидеть перевод</div></div>
      <div class="face back"><div class="word" id="ru"></div></div>
    </div>
  </div>
  <nav>
    <button class="btn prev" id="prev">← Назад</button>
    <div class="counter" id="counter"></div>
    <button class="btn next" id="next">Вперёд →</button>
  </nav>
  <div class="know"><button class="btn again" id="again">😕 Повторить</button><button class="btn knowb" id="know">✅ Знаю</button></div>
  <div class="legend">🔵 der · 🔴 die · 🟢 das</div>
  <div class="tools"><button class="shuffle" id="dirBtn"></button><button class="shuffle" id="shuffle">🔀 Перемешать</button><button class="shuffle" id="quizBtn">🎯 Тест</button><button class="shuffle" id="guideBtn">📖 Как читать</button><button class="shuffle" id="bgBtn"></button></div>
</main>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

  deckSel.onchange = loadDeck;
  $("shuffle").onclick = () => {
    for (let k = words.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [words[k], words[j]] = [words[j], words[k]]; }
    i = 0; render();
  };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  });

  // Свайп влево/вправо
  let x0 = null;
  card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 60) { go(dx < 0 ? 1 : -1); card._swiped = true; setTimeout(() => card._swiped = false, 50); }
    x0 = null;
  });
  card.addEventListener("click", e => { if (card._swiped) { e.stopImmediatePropagation(); } }, true);

  // Немецкие буквы на фоне: только в боковых полях
  const chars = ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü", "der", "die", "das", "ja", "nein"];
  for (let k = 0; k < 12; k++) {
    const s = document.createElement("span");
    s.className = "letter";
    s.textContent = chars[k % chars.length];
    const left = k % 2 ? Math.random() * 9 : 90 + Math.random() * 6;
    s.style.left = left + "%";
    s.style.fontSize = 26 + Math.random() * 26 + "px";
    s.style.animationDuration = 40 + Math.random() * 30 + "s";
    s.style.animationDelay = -Math.random() * 60 + "s";
    $("bg").appendChild(s);
  }

  // Переключатель фона: спокойный (по умолчанию) / яркий
  let vivid = false;
  try { vivid = localStorage.getItem("bg") === "vivid"; } catch (e) {}
  function applyBg() {
    document.body.classList.toggle("calm", !vivid);
    $("bgBtn").textContent = vivid ? "🌙 Спокойный фон" : "✨ Яркий фон";
  }
  $("bgBtn").onclick = () => {
    vivid = !vivid;
    try { localStorage.setItem("bg", vivid ? "vivid" : "calm"); } catch (e) {}
    applyBg();
  };
  applyBg();

  // Поиск по немецкому и русскому (ä=a, ö=o, ü=u, ß=ss)
  const norm = t => t.toLowerCase().replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss").replace(/ё/g, "е");
  const resBox = $("results");
  $("q").oninput = () => {
    const q = norm($("q").value.trim());
    resBox.innerHTML = "";
    if (!q) { resBox.hidden = true; return; }
    const found = ALL.filter(w => norm(w.de).includes(q) || norm(w.ru).includes(q));
    resBox.hidden = false;
    if (!found.length) { resBox.innerHTML = '<div class="none">Ничего не найдено</div>'; return; }
    found.slice(0, 30).forEach((w, idx) => {
      const b = document.createElement("button");
      b.textContent = w.de + " — " + w.ru;
      b.onclick = () => { words = found; i = idx; resBox.hidden = true; $("q").value = ""; render(); card.classList.add("flipped"); };
      resBox.appendChild(b);
    });
  };
  deckSel.addEventListener("change", () => { $("q").value = ""; resBox.hidden = true; });

  // Счётчик пользователей (см. инструкцию): вставь ссылку Apps Script и свой Telegram ID
  const STATS_URL = "";
  const OWNER_ID = 0;
  const me = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (STATS_URL && me) {
    fetch(STATS_URL + "?uid=" + me.id).then(r => r.text()).then(t => {
      if (me.id === OWNER_ID) { $("stat").textContent = "👥 Пользователей: " + t; $("stat").hidden = false; }
    }).catch(() => {});
  }

  // Озвучка немецкого слова
  $("speak").onclick = () => {
    if (!window.speechSynthesis) return;
    const t = words[i].de.replace(/\(.*?\)/g, "").split(" / ")[0].trim();
    const u = new SpeechSynthesisUtterance(t); u.lang = "de-DE"; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };

  // Знаю / Повторить
  function setKnown(de, flag) {
    flag ? known.add(de) : known.delete(de);
    try { localStorage.setItem("known", JSON.stringify([...known])); } catch (e) {}
  }
  const mark = flag => { setKnown(words[i].de, flag); if (i < words.length - 1) go(1); else render(); };
  $("know").onclick = () => mark(true);
  $("again").onclick = () => mark(false);

  // Окно (подсказка по чтению и тест)
  function openModal(html) {
    $("sheet").innerHTML = html + '<button class="shuffle" id="mclose">Закрыть ✕</button>';
    $("modal").hidden = false;
    $("mclose").onclick = () => { $("modal").hidden = true; render(); };
  }
  $("guideBtn").onclick = () => openModal("<h2>📖 Как читать по-немецки</h2>" + [
    "<b>ä</b> — как «э»", "<b>ö</b> — как «ё», но губы трубочкой", "<b>ü</b> — как «ю» в слове «тюль»", "<b>ß</b> — как «сс»",
    "<b>ch</b> — «х» (мягкое после e, i)", "<b>sch</b> — «ш»", "<b>sp-</b> / <b>st-</b> в начале — «шп» / «шт»",
    "<b>ei</b> — «ай»", "<b>ie</b> — долгое «и»", "<b>eu</b>, <b>äu</b> — «ой»", "<b>v</b> — «ф»", "<b>w</b> — «в»", "<b>z</b> — «ц»",
    "<b>s</b> перед гласной — «з»", "Все существительные пишутся с большой буквы"
  ].map(x => "<p>" + x + "</p>").join("") + "<p>🔊 Нажми на кнопку рядом с карточкой, чтобы услышать слово.</p>");

  let qs = { n: 0, ok: 0 };
  function quiz() {
    const w = words[Math.floor(Math.random() * words.length)];
    const ans = rev ? w.de : w.ru, q = rev ? w.ru : w.de;
    const opts = [ans];
    while (opts.length < 4) {
      const o = ALL[Math.floor(Math.random() * ALL.length)], t = rev ? o.de : o.ru;
      if (!opts.includes(t)) opts.push(t);
    }
    opts.sort(() => Math.random() - 0.5);
    openModal("<h2>🎯 Тест</h2><p>Верно: " + qs.ok + " из " + qs.n + '</p><div class="qw">' + q + '</div><div id="opts"></div><div id="nx"></div>');
    opts.forEach(t => {
      const b = document.createElement("button"); b.className = "opt"; b.textContent = t;
      b.onclick = () => {
        qs.n++; const good = t === ans; if (good) qs.ok++;
        setKnown(w.de, good);
        [...$("opts").children].forEach(x => { x.disabled = true; if (x.textContent === ans) x.classList.add("ok"); });
        if (!good) b.classList.add("bad");
        const nx = document.createElement("button"); nx.className = "shuffle"; nx.textContent = "Дальше →"; nx.onclick = quiz;
        $("nx").appendChild(nx);
      };
      $("opts").appendChild(b);
    });
  }
  $("quizBtn").onclick = () => { qs = { n: 0, ok: 0 }; quiz(); };

  // Переключатель направления: 🇩🇪 → 🇷🇺 / 🇷🇺 → 🇩🇪
  function applyDir() { $("dirBtn").textContent = rev ? "🇷🇺 → 🇩🇪" : "🇩🇪 → 🇷🇺"; }
  $("dirBtn").onclick = () => {
    rev = !rev;
    try { localStorage.setItem("dir", rev ? "ru" : "de"); } catch (e) {}
    applyDir();
    render();
  };
  applyDir();

  loadDeck();
</script>
</body>
</html>
