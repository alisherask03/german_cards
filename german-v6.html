<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Немецкие карточки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #1c1233;
    --paper: #fffaf0;
    --pink: #ff3d8b;
    --amber: #ffb627;
    --teal: #19d3c5;
    --violet: #6a3dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: #140a2b;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- Фон: цвет по краям, тишина в центре ---------- */
  :root { --h: 0; }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #130828; }
  /* тёмная «подушка» за карточкой, чтобы слово читалось на любом фоне */
  .bg::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 42% at 50% 48%, rgba(15,7,32,.92) 0%, rgba(15,7,32,.6) 55%, transparent 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(55px); opacity: .55;
    animation: drift 32s ease-in-out infinite alternate;
    transition: background-color 2s ease, opacity .6s; }
  .b1 { width: 340px; height: 340px; top: -110px;  left: -110px;  background: hsl(calc(var(--h) + 330), 95%, 58%); }
  .b2 { width: 360px; height: 360px; bottom: -120px; right: -120px; background: hsl(calc(var(--h) + 175), 90%, 50%); animation-delay: -9s; }
  .b3 { width: 280px; height: 280px; top: -90px;  right: -110px; background: hsl(calc(var(--h) + 40), 100%, 58%); animation-delay: -17s; }
  .b4 { width: 300px; height: 300px; bottom: -110px; left: -120px; background: hsl(calc(var(--h) + 260), 95%, 62%); animation-delay: -5s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.2); }
  }
  /* немецкие буквы плывут только вдоль краёв, не за карточкой */
  .letter { position: absolute; bottom: -60px; font-weight: 900; color: rgba(255,255,255,.07);
    animation: rise linear infinite; user-select: none; }
  @keyframes rise { to { transform: translateY(-125vh) rotate(25deg); } }
  /* яркий режим: насыщеннее и быстрее */
  body:not(.calm) .blob { opacity: .85; animation-duration: 14s; }
  body:not(.calm) .letter { color: rgba(255,255,255,.14); }
  .tools { position: relative; z-index: 1; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  #q { width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 16px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(20,10,43,.55); color: #fff; font-size: 16px; backdrop-filter: blur(8px); outline: none; }
  #q::placeholder { color: rgba(255,255,255,.55); }
  #results { margin-top: 8px; max-height: 34vh; overflow-y: auto; border-radius: 16px; background: rgba(20,10,43,.85); }
  #results button { display: block; width: 100%; text-align: left; padding: 10px 14px; background: none; border: 0;
    border-bottom: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 15px; cursor: pointer; }
  #results .none { padding: 10px 14px; opacity: .7; font-size: 15px; }
  .stat { text-align: center; font-size: 13px; opacity: .8; margin-top: 8px; }

  /* ---------- Layout ---------- */
  header, main, nav { position: relative; z-index: 1; width: 100%; max-width: 440px; }
  h1 { font-size: 26px; margin: 4px 0 14px; text-align: center; letter-spacing: .5px;
    text-shadow: 0 3px 0 rgba(255,61,139,.55); }
  select {
    width: 100%; padding: 13px 14px; border-radius: 16px; border: 2px solid rgba(255,255,255,.25);
    background: rgba(20,10,43,.55); color: #fff; font-size: 16px; backdrop-filter: blur(8px);
    appearance: none; -webkit-appearance: none;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }

  /* ---------- Card ---------- */
  .scene { width: 100%; height: 250px; perspective: 1200px; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card.enter { animation: pop .4s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.85) rotate(-3deg); } }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; box-shadow: 0 18px 0 -6px rgba(0,0,0,.28), 0 28px 50px rgba(0,0,0,.35); }
  .front { background: var(--paper); color: var(--ink); border: 6px solid var(--art, var(--ink)); }
  .back  { background: linear-gradient(135deg, var(--amber), var(--pink)); color: var(--ink);
           border: 6px solid var(--art, var(--ink)); transform: rotateY(180deg); }
  .word { font-size: clamp(34px, 11vw, 52px); font-weight: 900; line-height: 1.1; word-break: break-word; }
  .hint { margin-top: 18px; font-size: 14px; opacity: .55; }

  /* ---------- Controls ---------- */
  nav { display: flex; align-items: center; gap: 12px; }
  .btn { flex: 1; padding: 16px 0; font-size: 18px; font-weight: 800; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px; cursor: pointer;
    box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; }
  .prev { background: var(--teal); }
  .next { background: var(--amber); }
  .counter { min-width: 76px; text-align: center; font-weight: 800; font-size: 17px; }
  .shuffle { position: relative; z-index: 1; margin-top: 14px; background: none; border: 2px dashed rgba(255,255,255,.4);
    color: #fff; border-radius: 14px; padding: 8px 16px; font-size: 14px; cursor: pointer; }

  .scene { position: relative; }
  .fab { position: absolute; top: -14px; right: -6px; z-index: 5; width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid var(--ink); background: var(--teal); font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  .fab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .know { display: flex; gap: 12px; width: 100%; }
  .again { background: var(--pink); } .knowb { background: #3ddc84; }
  .legend { font-size: 13px; opacity: .85; text-align: center; }
  #modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,5,24,.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; background: #1c1233; border: 2px solid rgba(255,255,255,.25); border-radius: 22px; padding: 20px; }
  .sheet h2 { margin: 0 0 12px; } .sheet p { margin: 6px 0; font-size: 15px; line-height: 1.35; }
  .qw { font-size: 30px; font-weight: 900; text-align: center; margin: 14px 0; }
  .opt { display: block; width: 100%; margin: 8px 0; padding: 13px; font-size: 17px; font-weight: 700; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; }
  .opt.ok { background: #1f9d55; border-color: #3ddc84; } .opt.bad { background: #b3263e; border-color: #ff5a73; }
  #bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.15); margin-top: 6px; overflow: hidden; }
  #fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #19d3c5, #ffb627, #ff3d8b); transition: width .5s; }
  body { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  header[hidden], main[hidden] { display: none; }
  .screen { position: relative; z-index: 1; width: 100%; max-width: 440px; overflow-y: auto; flex: 1; }
  .screen[hidden] { display: none; }
  .screen h1 { font-size: 24px; margin: 4px 0 10px; text-align: center; }
  .screen p { margin: 8px 0; font-size: 15px; line-height: 1.4; }
  .pb { height: 8px; border-radius: 8px; background: rgba(255,255,255,.15); overflow: hidden; margin: 6px 0 12px; }
  .pb i { display: block; height: 100%; background: linear-gradient(90deg, #19d3c5, #ffb627, #ff3d8b); }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 8px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(15,7,32,.94); border-top: 1px solid rgba(255,255,255,.12); }
  #tabs button { flex: 1; max-width: 140px; padding: 10px 0; border-radius: 14px; border: 2px solid transparent; background: none; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  #tabs button.on { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); }
  .sheet b { color: #ffb627; }
  @media (prefers-reduced-motion: reduce) { .blob, .letter, .card, .card.enter { animation: none; transition: none; } }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<header>
  <h1>🇩🇪 Немецкие карточки</h1>
  <select id="deck" aria-label="Набор слов"></select>
  <input id="q" type="search" placeholder="🔍 Поиск: по-немецки или по-русски" autocomplete="off">
  <div id="results" hidden></div>
  <div id="stat" class="stat" hidden></div>
  <div id="prog" class="stat"></div>
  <div id="bar"><i id="fill"></i></div>
</header>

<main>
  <div class="scene">
    <button class="fab" id="speak" aria-label="Озвучить">🔊</button>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку">
      <div class="face front"><div class="word" id="de"></div><div class="hint">Нажмите, чтобы увидеть перевод</div></div>
      <div class="face back"><div class="word" id="ru"></div></div>
    </div>
  </div>
  <nav>
    <button class="btn prev" id="prev">← Назад</button>
    <div class="counter" id="counter"></div>
    <button class="btn next" id="next">Вперёд →</button>
  </nav>
  <div class="know"><button class="btn again" id="again">😕 Повторить</button><button class="btn knowb" id="know">✅ Знаю</button></div>
  <div class="legend">🔵 der · 🔴 die · 🟢 das</div>
  <div class="tools"><button class="shuffle" id="dirBtn"></button><button class="shuffle" id="shuffle">🔀 Перемешать</button><button class="shuffle" id="quizBtn">🎯 Тест</button><button class="shuffle" id="guideBtn">📖 Как читать</button><button class="shuffle" id="bgBtn"></button></div>
</main>

<section id="gr" class="screen" hidden></section>
<section id="me" class="screen" hidden></section>
<div id="tabs"><button data-t="w" class="on">📇 Слова</button><button data-t="g">📘 Грамматика</button><button data-t="p">👤 Прогресс</button></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };

  // Знаю / Повторить
  function setKnown(de, flag) {
    const was = known.has(de);
    flag ? known.add(de) : known.delete(de);
    const t = new Date().toISOString().slice(0, 10), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    if (st.day !== t) { st.n = st.day === y ? st.n + 1 : 1; st.day = t; st.c = 0; }
    if (flag && !was) st.c++;
    try { localStorage.setItem("known", JSON.stringify([...known])); localStorage.setItem("st", JSON.stringify(st)); } catch (e) {}
    const u = LEVELS.filter(([l]) => unlocked(l)).length;
    if (u !== lastU) {
      const up = u > lastU; lastU = u; fill();
      if (up) { const m = "🎉 Открыт уровень " + LEVELS[u - 1][0] + " · " + LEVELS[u - 1][2] + "!"; tg && tg.showAlert ? tg.showAlert(m) : alert(m); }
    }
  }
  const mark = flag => { setKnown(words[i].de, flag); if (i < words.length - 1) go(1); else render(); };
  $("know").onclick = () => mark(true);
  $("again").onclick = () => mark(false);

  // Окно (подсказка по чтению и тест)
  function openModal(html) {
    $("sheet").innerHTML = html + '<button class="shuffle" id="mclose">Закрыть ✕</button>';
    $("modal").hidden = false;
    $("mclose").onclick = () => { $("modal").hidden = true; refreshScreens(); };
  }
  $("guideBtn").onclick = () => openModal("<h2>📖 Как читать по-немецки</h2>" + [
    "<b>ä</b> — как «э»", "<b>ö</b> — как «ё», но губы трубочкой", "<b>ü</b> — как «ю» в слове «тюль»", "<b>ß</b> — как «сс»",
    "<b>ch</b> — «х» (мягкое после e, i)", "<b>sch</b> — «ш»", "<b>sp-</b> / <b>st-</b> в начале — «шп» / «шт»",
    "<b>ei</b> — «ай»", "<b>ie</b> — долгое «и»", "<b>eu</b>, <b>äu</b> — «ой»", "<b>v</b> — «ф»", "<b>w</b> — «в»", "<b>z</b> — «ц»",
    "<b>s</b> перед гласной — «з»", "Все существительные пишутся с большой буквы"
  ].map(x => "<p>" + x + "</p>").join("") + "<p>🔊 Нажми на кнопку рядом с карточкой, чтобы услышать слово.</p>");

  let qs = { n: 0, ok: 0 };
  const QN = 10;
  function quiz() {
    if (qs.n >= QN) return result();
    const un = words.filter(w => !known.has(w.de)), src = un.length ? un : words;
    const w = src[Math.floor(Math.random() * src.length)];
    const ans = rev ? w.de : w.ru, q = rev ? w.ru : w.de, P = pool();
    const opts = [ans];
    while (opts.length < 4) {
      const o = P[Math.floor(Math.random() * P.length)], t = rev ? o.de : o.ru;
      if (!opts.includes(t)) opts.push(t);
    }
    opts.sort(() => Math.random() - 0.5);
    openModal("<h2>🎯 Вопрос " + (qs.n + 1) + " из " + QN + "</h2><p>Верно: " + qs.ok + "</p>" + '<div class="qw">' + q + '</div><div id="opts"></div><div id="nx"></div>');
    opts.forEach(t => {
      const b = document.createElement("button"); b.className = "opt"; b.textContent = t;
      b.onclick = () => {
        qs.n++; const good = t === ans; if (good) qs.ok++;
        setKnown(w.de, good);
        [...$("opts").children].forEach(x => { x.disabled = true; if (x.textContent === ans) x.classList.add("ok"); });
        if (!good) b.classList.add("bad");
        const nx = document.createElement("button"); nx.className = "shuffle"; nx.textContent = qs.n >= QN ? "Результат →" : "Дальше →"; nx.onclick = quiz;
        $("nx").appendChild(nx);
      };
      $("opts").appendChild(b);
    });
  }
  function result() {
    const p = Math.round(qs.ok * 100 / QN), dk = words.filter(w => known.has(w.de)).length;
    const title = p >= 90 ? "🏆 Отлично!" : p >= 70 ? "👍 Хорошо!" : p >= 50 ? "🙂 Неплохо" : "💪 Давай ещё раз";
    openModal("<h2>" + title + "</h2><p>Правильно: " + qs.ok + " из " + QN + " (" + p + "%)</p><p>В колоде выучено: " + dk + " из " + words.length + "</p><p>Осталось выучить: " + (words.length - dk) + '</p><button class="shuffle" id="again2">🔁 Ещё раунд</button>');
    $("again2").onclick = () => { qs = { n: 0, ok: 0 }; quiz(); };
  }
  function lockInfo(l) {
    const k = LEVELS.findIndex(x => x[0] === l), p = LEVELS[k - 1][0];
    const tot = lvlWords(p).length, need = Math.ceil(tot * UNLOCK), done = lvlDone(p);
    openModal("<h2>🔒 Уровень " + l + " пока закрыт</h2><p>Чтобы открыть его, выучи " + Math.round(UNLOCK * 100) + "% слов уровня " + p + ".</p><p>Выучено: <b>" + done + " из " + need + "</b> нужных (всего в уровне " + tot + ")</p><p>Осталось выучить: <b>" + Math.max(0, need - done) + "</b></p><p>Слово считается выученным, когда ты нажимаешь «✅ Знаю» или отвечаешь верно в тесте.</p>" + '<button class="shuffle" id="go">Перейти к уровню ' + p + "</button>");
    $("go").onclick = () => { $("modal").hidden = true; deckSel.value = Object.keys(LVKEY).find(x => LVKEY[x] === p); loadDeck(); };
  }
  $("quizBtn").onclick = () => { qs = { n: 0, ok: 0 }; quiz(); };

  // ===== Грамматика, прогресс, вкладки =====
  const GR = [
{id:"a1-1",l:"A1",t:"Глаголы sein и haben",b:"<p><b>sein</b> (быть): ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.</p><p><b>haben</b> (иметь): ich habe, du hast, er hat, wir haben, ihr habt, sie haben.</p><p>Ich bin müde. Er hat einen Hund.</p>",q:[["Ich ___ müde.",["bin","bist","ist"],0],["Er ___ einen Hund.",["habe","hat","haben"],1]]},
{id:"a1-2",l:"A1",t:"Артикли и род",b:"<p>Три рода: <b>der</b> (м.), <b>die</b> (ж.), <b>das</b> (ср.). Во множественном числе всегда <b>die</b>. Неопределённый артикль: ein (м., ср.), eine (ж.).</p><p>Учи слово сразу с артиклем: цвет рамки карточки подскажет род.</p>",q:[["___ Katze",["der","die","das"],1],["___ Kind",["der","die","das"],2]]},
{id:"a1-3",l:"A1",t:"Порядок слов: глагол на 2-м месте",b:"<p>Глагол всегда на <b>втором месте</b>: Ich lerne heute Deutsch. Если начать с «heute», подлежащее уходит за глагол: Heute lerne ich Deutsch.</p><p>В вопросе без вопросительного слова глагол первый: Lernst du Deutsch?</p>",q:[["Выбери верный порядок:",["Heute ich lerne Deutsch.","Heute lerne ich Deutsch.","Ich heute lerne Deutsch."],1],["Ich ___ aus Usbekistan.",["komme","kommst","kommt"],0]]},
{id:"a1-4",l:"A1",t:"Отрицание: nicht и kein",b:"<p><b>kein/keine</b> отрицает существительное: Ich habe kein Auto.</p><p><b>nicht</b> отрицает глагол, прилагательное и всё остальное: Er arbeitet nicht. Das ist nicht gut.</p>",q:[["Ich habe ___ Auto.",["kein","nicht"],0],["Er arbeitet ___.",["kein","nicht"],1]]},
{id:"a2-1",l:"A2",t:"Perfekt: разговорное прошедшее",b:"<p><b>haben/sein + Partizip II</b>: Ich habe gelernt. Wir haben Pizza gegessen.</p><p>С <b>sein</b> идут глаголы движения и смены состояния: Ich bin gegangen. Er ist gefahren.</p>",q:[["Gestern ___ ich Pizza gegessen.",["habe","bin"],0],["Wir ___ nach Berlin gefahren.",["haben","sind"],1]]},
{id:"a2-2",l:"A2",t:"Модальные глаголы",b:"<p>können (мочь), müssen (быть должным), wollen (хотеть), dürfen (иметь разрешение), sollen (следует), mögen/möchten.</p><p>Модальный глагол на 2-м месте, <b>смысловой — инфинитив в конце</b>: Ich kann heute nicht kommen. Du musst arbeiten.</p>",q:[["Ich ___ heute arbeiten.",["muss","musst","müssen"],0],["Du ___ hier nicht rauchen.",["darfst","darf","dürfen"],0]]},
{id:"a2-3",l:"A2",t:"Akkusativ и Dativ",b:"<p><b>Akkusativ</b> (кого? что?): der → <b>den</b>, die → die, das → das. Ich sehe den Mann.</p><p><b>Dativ</b> (кому? чему?): der → <b>dem</b>, die → <b>der</b>, das → <b>dem</b>. Ich helfe dem Mann. Dativ после: mit, bei, nach, von, zu, aus, seit.</p>",q:[["Ich kaufe ___ Hund.",["der","den","dem"],1],["Ich helfe ___ Frau.",["die","der","den"],1]]},
{id:"b1-1",l:"B1",t:"Придаточные: weil, dass, wenn",b:"<p>В придаточном <b>спрягаемый глагол уходит в конец</b>: Ich bleibe zu Hause, weil ich krank bin. Ich glaube, dass er schon da ist. Wenn es regnet, bleibe ich hier.</p>",q:[["Выбери верно:",["Ich bleibe zu Hause, weil ich krank bin.","Ich bleibe zu Hause, weil bin ich krank.","Ich bleibe zu Hause, weil ich bin krank."],0],["Выбери верно:",["Ich weiß, dass er morgen kommt.","Ich weiß, dass kommt er morgen.","Ich weiß, dass er kommt morgen."],0]]},
{id:"b1-2",l:"B1",t:"Präteritum: простое прошедшее",b:"<p>Чаще в письме и рассказах. Особые формы: sein → <b>war</b>, haben → <b>hatte</b>, können → konnte, wollen → wollte, gehen → ging. Слабые глаголы: -te (lernen → lernte).</p>",q:[["Gestern ___ ich krank.",["war","bin","wurde"],0],["Er ___ gestern keine Zeit.",["hatte","hat","haben"],0]]},
{id:"b1-3",l:"B1",t:"Относительные придаточные",b:"<p>Начинаются с относительного местоимения: род и число как у существительного, падеж по роли в придаточном: der Mann, <b>der</b> dort arbeitet; die Frau, <b>die</b> ich sehe; das Buch, <b>das</b> ich lese. Глагол в конце, перед придаточным запятая.</p>",q:[["Das ist der Mann, ___ dort arbeitet.",["der","den","dem"],0],["Das Buch, ___ ich lese, ist gut.",["das","die","der"],0]]},
{id:"b2-1",l:"B2",t:"Konjunktiv II: нереальное и вежливое",b:"<p>Для нереальных желаний и вежливых просьб: <b>wäre, hätte, würde + инфинитив</b>.</p><p>Wenn ich Zeit hätte, würde ich reisen. Ich hätte gern einen Kaffee. Wenn ich du wäre, würde ich das tun.</p>",q:[["Wenn ich Zeit ___, würde ich reisen.",["hätte","habe","hatte"],0],["Wenn ich du ___, würde ich das tun.",["wäre","bin","war"],0]]},
{id:"b2-2",l:"B2",t:"Passiv",b:"<p><b>werden + Partizip II</b>: Das Haus wird gebaut. Die Briefe werden geschrieben. Прошедшее: wurde gebaut. Деятель: von + Dativ (von Arbeitern).</p>",q:[["Das Auto ___ repariert.",["wird","ist","hat"],0],["Die Briefe ___ geschrieben.",["werden","wird","sind"],0]]},
{id:"b2-3",l:"B2",t:"Genitiv и предлоги с Genitiv",b:"<p>Genitiv: <b>des</b> (м., ср.) + окончание -s/-es, <b>der</b> (ж. и мн.). Das Auto des Mannes. Предлоги с Genitiv: wegen, trotz, während, statt: wegen des Regens.</p>",q:[["wegen ___ Wetters",["des","dem","das"],0],["die Tasche ___ Frau",["der","die","den"],0]]},
{id:"c1-1",l:"C1",t:"Konjunktiv I: косвенная речь",b:"<p>Для передачи чужих слов (СМИ, официальный стиль): Er sagt, er <b>sei</b> krank. Sie sagt, sie <b>habe</b> keine Zeit. Er sagt, er <b>komme</b> morgen.</p><p>Если форма совпадает с Indikativ, используют Konjunktiv II.</p>",q:[["Er sagte, er ___ müde.",["sei","ist","wäre"],0],["Sie sagt, sie ___ keine Zeit.",["habe","hat","hätte"],0]]},
{id:"c1-2",l:"C1",t:"Funktionsverbgefüge: устойчивые сочетания",b:"<p>Существительное + глагол, типично для делового стиля: eine Entscheidung <b>treffen</b>, in Betracht <b>ziehen</b>, zur Verfügung <b>stellen</b>, Rücksicht <b>nehmen</b>. Запоминай глагол вместе со словом.</p>",q:[["eine Entscheidung ___",["treffen","machen","geben"],0],["zur Verfügung ___",["stellen","legen","setzen"],0]]}
];

{id:"a1-5",l:"A1",t:"Спряжение глаголов в настоящем времени",b:"<p>Основа + окончание: ich lern<b>e</b>, du lern<b>st</b>, er/sie/es lern<b>t</b>, wir lern<b>en</b>, ihr lern<b>t</b>, sie/Sie lern<b>en</b>.</p><p>Если основа на -t/-d, добавляется -e-: du arbeit<b>e</b>st, er arbeit<b>e</b>t.</p>",q:[["Du ___ Deutsch.",["lernst","lerne","lernt"],0],["Wir ___ in Taschkent.",["wohnen","wohnt","wohne"],0],["Er ___ jeden Tag.",["arbeitet","arbeitt","arbeiten"],0],["Ihr ___ gut.",["spielt","spielen","spiele"],0]]},
{id:"a1-6",l:"A1",t:"Вопросительные слова (W-Fragen)",b:"<p><b>wer</b> кто, <b>was</b> что, <b>wo</b> где, <b>woher</b> откуда, <b>wohin</b> куда, <b>wann</b> когда, <b>warum</b> почему, <b>wie</b> как. Глагол стоит сразу после вопросительного слова: Wo wohnst du?</p>",q:[["___ wohnst du? — In Taschkent.",["Wo","Woher","Wohin"],0],["___ kommst du? — Aus Usbekistan.",["Woher","Wo","Wann"],0],["___ ist das? — Das ist ein Buch.",["Was","Wer","Wie"],0],["___ heißt du?",["Wie","Wo","Wer"],0]]},
{id:"a1-7",l:"A1",t:"Притяжательные местоимения",b:"<p><b>mein</b> мой, <b>dein</b> твой, <b>sein</b> его, <b>ihr</b> её, <b>unser</b> наш, <b>euer</b> ваш. Для женского рода и множественного числа окончание -e: meine Mutter, deine Eltern.</p>",q:[["Das ist ___ Mutter. (моя)",["meine","mein","meinen"],0],["___ Bruder arbeitet hier. (твой)",["Dein","Deine","Deinen"],0],["Das ist ___ Haus. (наш)",["unser","unsere","uns"],0],["Wo ist ___ Tasche? (её)",["ihre","ihr","sein"],0]]},
{id:"a2-4",l:"A2",t:"Глаголы с отделяемой приставкой",b:"<p>aufstehen, anrufen, einkaufen: приставка уходит в конец: Ich <b>stehe</b> um 7 Uhr <b>auf</b>. Er <b>ruft</b> mich <b>an</b>. В Perfekt: -ge- между приставкой и основой: aufgestanden, angerufen.</p>",q:[["Выбери верно:",["Ich stehe um 7 Uhr auf.","Ich aufstehe um 7 Uhr.","Ich stehe auf um 7 Uhr."],0],["Выбери верно:",["Er ruft mich an.","Er anruft mich.","Er mich ruft an."],0],["Sie kauft im Supermarkt ___.",["ein","an","auf"],0],["Ich habe ihn gestern ___.",["angerufen","anrufen","geanrufen"],0]]},
{id:"a2-5",l:"A2",t:"Предлоги места: Wo? и Wohin?",b:"<p>Предлоги in, auf, an, unter, neben, über, vor, hinter + <b>Dativ</b> на вопрос Wo? (Ich bin in <b>der</b> Küche) и + <b>Akkusativ</b> на вопрос Wohin? (Ich gehe in <b>die</b> Küche).</p>",q:[["Ich bin in ___ Küche. (Wo?)",["der","die","den"],0],["Ich gehe in ___ Küche. (Wohin?)",["die","der","dem"],0],["Das Bild hängt an ___ Wand.",["der","die","dem"],0],["Ich stelle das Glas auf ___ Tisch.",["den","dem","der"],0]]},
{id:"a2-6",l:"A2",t:"Степени сравнения прилагательных",b:"<p>schön – <b>schöner</b> – am <b>schönsten</b>. Часто с умлаутом: groß – größer – am größten. Исключения: gut – <b>besser</b> – am <b>besten</b>, viel – <b>mehr</b> – am <b>meisten</b>. Сравнение: <b>als</b> (чем), <b>so ... wie</b> (так же, как).</p>",q:[["Er ist ___ als ich.",["größer","groß","am größten"],0],["gut → ___",["besser","guter","mehr"],0],["Das ist der ___ Film. (самый красивый)",["schönste","schöner","schön"],0],["Berlin ist größer ___ Hamburg.",["als","wie","dass"],0]]},
{id:"b1-4",l:"B1",t:"Склонение прилагательных после артикля",b:"<p>После der/die/das: <b>-e</b> в Nominativ (и Akkusativ ж., ср.), везде остальное <b>-en</b>. der große Mann, die nette Frau, das kleine Kind; Ich sehe den großen Mann; mit dem kleinen Kind.</p>",q:[["der ___ Mann",["große","groß","großen"],0],["Ich sehe den ___ Mann.",["großen","große","groß"],0],["die ___ Frau",["nette","netten","nett"],0],["mit dem ___ Kind",["kleinen","kleine","klein"],0]]},
{id:"b1-5",l:"B1",t:"Инфинитив с zu и um ... zu",b:"<p>Инфинитивный оборот: Ich habe keine Lust, früh <b>aufzustehen</b>. Цель: <b>um ... zu</b> + инфинитив: Ich lerne Deutsch, <b>um</b> in Deutschland <b>zu</b> arbeiten. У отделяемых глаголов zu встаёт между приставкой и основой.</p>",q:[["Ich lerne, ___ in Deutschland zu arbeiten.",["um","für","damit"],0],["Ich habe Zeit, dich ___ besuchen.",["zu","um","für"],0],["Er geht in die Stadt, um ein Buch ___ kaufen.",["zu","zum","für"],0],["Ich habe keine Lust, früh ___.",["aufzustehen","zu aufstehen","aufstehen zu"],0]]},
{id:"b1-6",l:"B1",t:"Возвратные глаголы",b:"<p>sich freuen, sich erinnern, sich ärgern, sich interessieren: ich freue <b>mich</b>, du freust <b>dich</b>, er freut <b>sich</b>, wir freuen <b>uns</b>, ihr freut <b>euch</b>, sie freuen <b>sich</b>.</p>",q:[["Ich freue ___ auf den Urlaub.",["mich","dich","sich"],0],["Du ärgerst ___.",["dich","mich","sich"],0],["Er interessiert ___ für Musik.",["sich","ihn","mich"],0],["Wir treffen ___ morgen.",["uns","euch","sich"],0]]},
{id:"b2-4",l:"B2",t:"Двойные союзы",b:"<p><b>entweder ... oder</b> (или ... или), <b>sowohl ... als auch</b> (и ... и), <b>weder ... noch</b> (ни ... ни), <b>nicht nur ... sondern auch</b> (не только ... но и), <b>je ... desto</b> (чем ... тем).</p>",q:[["Er spricht ___ Deutsch ___ Englisch.",["sowohl ... als auch","entweder ... oder","weder ... noch"],0],["Ich habe ___ Zeit ___ Geld.",["weder ... noch","sowohl ... als auch","entweder ... oder"],0],["Je mehr ich lerne, ___ besser verstehe ich.",["desto","dann","so"],0],["Nicht nur ich, ___ auch er kommt.",["sondern","aber","oder"],0]]},
{id:"b2-5",l:"B2",t:"Придаточное в начале предложения",b:"<p>Если придаточное стоит <b>первым</b>, то в главном предложении глагол идёт сразу после запятой (инверсия): Weil er müde war, <b>ging er</b> früh ins Bett. Wenn es regnet, <b>bleibe ich</b> zu Hause.</p>",q:[["Weil er müde war, ...",["ging er früh ins Bett.","er ging früh ins Bett."],0],["Wenn es regnet, ...",["bleibe ich zu Hause.","ich bleibe zu Hause."],0],["Obwohl ich krank bin, ...",["gehe ich zur Arbeit.","ich gehe zur Arbeit."],0],["Dass er kommt, ...",["freut mich.","ich freue mich."],0]]},
{id:"b2-6",l:"B2",t:"Словообразование: существительные",b:"<p>Из глаголов: entscheiden → die Entscheidung, lösen → die Lösung (-ung). Из прилагательных: frei → die Freiheit, möglich → die Möglichkeit (-heit, -keit). Все эти существительные женского рода (die).</p>",q:[["Существительное от «entscheiden»:",["die Entscheidung","das Entscheiden","der Entscheid"],0],["frei → ___",["die Freiheit","die Freiung","das Frei"],0],["möglich → ___",["die Möglichkeit","die Möglichung","das Möglich"],0],["lösen → ___",["die Lösung","die Löschung","das Lösen"],0]]},
{id:"c1-3",l:"C1",t:"Причастные обороты (Partizipialattribute)",b:"<p>Partizip II = «сделанный»: der gestern <b>gekaufte</b> Wagen (= der Wagen, der gestern gekauft wurde). Partizip I = «делающий»: die <b>lesenden</b> Kinder (= die Kinder, die lesen). Причастие склоняется как прилагательное.</p>",q:[["Купленная вчера машина:",["der gestern gekaufte Wagen","der gestern kaufte Wagen","der gestern kaufende Wagen"],0],["Читающие дети:",["die lesenden Kinder","die gelesenen Kinder","die lesen Kinder"],0],["Открытое окно:",["das geöffnete Fenster","das öffnende Fenster","das öffnet Fenster"],0]]},
{id:"c1-4",l:"C1",t:"Модальные частицы",b:"<p>Придают речи оттенок: <b>doch</b> (мягко настаивает): Komm doch mal vorbei! <b>ja</b> (ведь, это известно): Das ist ja klar! <b>eben/halt</b> (ничего не поделаешь): Das ist eben so. <b>mal</b> смягчает просьбу.</p>",q:[["Komm ___ mal vorbei! (мягкое побуждение)",["doch","eben","ja"],0],["«Das ist eben so.» значит:",["Ничего не поделаешь","Ровно так","Вчера было так"],0],["Das ist ___ klar! (ведь это очевидно)",["ja","mal","halt"],0]]},
{id:"c1-5",l:"C1",t:"Konjunktiv II в прошедшем",b:"<p>О несбывшемся: <b>hätte/wäre + Partizip II</b>. Wenn ich das gewusst <b>hätte</b>, <b>wäre</b> ich gekommen. Ich <b>hätte</b> das nie getan.</p>",q:[["Wenn ich das gewusst ___, wäre ich gekommen.",["hätte","habe","hatte"],0],["Wenn er Zeit gehabt hätte, ___ er gekommen.",["wäre","hätte","war"],0],["Ich ___ das nie getan.",["hätte","bin","habe"],0]]}
  );
  let gp = new Set();
  try { gp = new Set(JSON.parse(localStorage.getItem("gp") || "[]")); } catch (e) {}
  function refreshScreens() { render(); if (!$("gr").hidden) renderGr(); if (!$("me").hidden) renderMe(); }
  function gQuiz(items, title, pass) {
    let k = 0, ok = 0;
    const next = () => {
      if (k >= items.length) {
        const all = ok >= Math.ceil(items.length * 0.8);
        if (pass && all) { gp.add(pass); try { localStorage.setItem("gp", JSON.stringify([...gp])); } catch (e) {} }
        openModal("<h2>" + (all ? "🏆" : "📝") + " " + title + "</h2><p>Правильно: " + ok + " из " + items.length + "</p>" + (pass ? (all ? "<p>✅ Урок пройден!</p>" : "<p>Для зачёта нужно не менее 80% верных ответов. Перечитай правило и попробуй ещё раз.</p>") : ""));
        return;
      }
      const [q, o, a] = items[k], order = o.map((t, i) => i).sort(() => Math.random() - 0.5);
      openModal("<h2>" + title + "</h2><p>Вопрос " + (k + 1) + " из " + items.length + '</p><div class="qw">' + q + '</div><div id="opts"></div><div id="nx"></div>');
      order.forEach(i => {
        const b = document.createElement("button"); b.className = "opt"; b.textContent = o[i];
        b.onclick = () => {
          const good = i === a; if (good) ok++; k++;
          [...$("opts").children].forEach(x => { x.disabled = true; if (x.textContent === o[a]) x.classList.add("ok"); });
          if (!good) b.classList.add("bad");
          const nx = document.createElement("button"); nx.className = "shuffle"; nx.textContent = k >= items.length ? "Результат →" : "Дальше →"; nx.onclick = next; $("nx").appendChild(nx);
        };
        $("opts").appendChild(b);
      });
    };
    next();
  }
  function openLesson(L) {
    openModal("<h2>📘 " + L.l + " · " + L.t + "</h2>" + L.b + '<button class="shuffle" id="gt">✍️ Пройти мини-тест</button>');
    $("gt").onclick = () => gQuiz(L.q, L.t, L.id);
  }
  function renderGr() {
    const box = $("gr"), done = GR.filter(x => gp.has(x.id)).length;
    box.innerHTML = "<h1>📘 Грамматика</h1><p>Пройдено уроков: <b>" + done + " из " + GR.length + '</b></p><div class="pb"><i style="width:' + done * 100 / GR.length + '%"></i></div>';
    const t = document.createElement("button"); t.className = "opt"; t.textContent = "🎯 Общий тест по грамматике (15 вопросов)";
    t.onclick = () => gQuiz(GR.filter(x => unlocked(x.l)).flatMap(x => x.q).sort(() => Math.random() - 0.5).slice(0, 15), "Тест по грамматике", null);
    box.appendChild(t);
    LEVELS.forEach(([l, e, n]) => {
      const h = document.createElement("p"); h.innerHTML = "<b>" + e + " " + l + " · " + n + "</b>"; box.appendChild(h);
      GR.filter(x => x.l === l).forEach(x => {
        const lock = !unlocked(l), b = document.createElement("button"); b.className = "opt";
        b.textContent = (lock ? "🔒 " : gp.has(x.id) ? "✅ " : "📖 ") + x.t;
        b.onclick = () => lock ? lockInfo(l) : openLesson(x); box.appendChild(b);
      });
    });
  }
  function renderMe() {
    let h = "<h1>👤 Мой прогресс</h1><p>🔥 Серия: <b>" + st.n + "</b> дн. · сегодня выучено: <b>" + st.c + "</b></p><p>✅ Всего слов выучено: <b>" + known.size + "</b> из " + ALL.length + "</p>";
    LEVELS.forEach(([l, e, n]) => {
      const t = lvlWords(l).length, d = lvlDone(l), g = GR.filter(x => x.l === l), gd = g.filter(x => gp.has(x.id)).length;
      h += "<p><b>" + (unlocked(l) ? "" : "🔒 ") + e + " " + l + " · " + n + "</b><br>Слова: " + d + " из " + t + " · Грамматика: " + gd + " из " + g.length + '</p><div class="pb"><i style="width:' + (t ? d * 100 / t : 0) + '%"></i></div>';
    });
    $("me").innerHTML = h;
  }
  function show(n) {
    document.querySelector("header").hidden = n !== "w"; document.querySelector("main").hidden = n !== "w";
    $("gr").hidden = n !== "g"; $("me").hidden = n !== "p";
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === n));
    if (n === "g") renderGr(); if (n === "p") renderMe();
  }
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.t));

  // Переключатель направления: 🇩🇪 → 🇷🇺 / 🇷🇺 → 🇩🇪
  function applyDir() { $("dirBtn").textContent = rev ? "🇷🇺 → 🇩🇪" : "🇩🇪 → 🇷🇺"; }
  $("dirBtn").onclick = () => {
    rev = !rev;
    try { localStorage.setItem("dir", rev ? "ru" : "de"); } catch (e) {}
    applyDir();
    render();
  };
  applyDir();

  loadDeck();
</script>
</body>
</html>
